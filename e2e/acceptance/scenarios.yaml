  - id: config.no-config
    title: "a project with neither tsconfig.json nor jsconfig.json does not crash any command"
    kind: config-shape
    tags: [os:linux, os:macos, kind:alias, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
      post:
        - label: "the project declares nothing: no tsconfig, no paths"
          rm: tsconfig.json
        - label: "and no jsconfig either, so there is no config file at all"
          run: { cmd: "test ! -e jsconfig.json" }
    speed: medium
    ci: { shard: config }
    covers: ["no config file at all"]
    notes: >
      A real user situation, and a 0.5.0 fix with a history: before it, a project
      with no tsconfig.json made status, doctor, diff, add and agents sync all
      crash with `Failed to load tsconfig.json. Couldn't find tsconfig.json`.
      Every one of those commands is exercised here, so a regression is caught
      whichever command reintroduces it.

      The consequence of having no config is also asserted: an alias nothing
      backs falls back to the source root, so components still land under src/
      and doctor can see them.
    steps:
      - use: init-copy-vega-neutral
      - use: add-button
      - name: status survives the missing tsconfig
        command: status
        args: ["--json"]
        expect:
          exit: 0
          stdoutContains: "button"
      - name: doctor survives it, and prints the alias mapping it fell back to
        command: doctor
        expect:
          exit: 0
          stdoutMatches: ["(?i)all checks passed", "(?i)import alias"]
      - name: diff survives it
        command: diff
        expect:
          exit: 0
          stdoutMatches: ["(?i)no updates found|up to date"]
      - name: agents sync survives it
        command: agents
        sub: ["sync"]
        args: ["--no-skill"]
        expect:
          exit: 0
          filesExist: ["AGENTS.md"]
          fileContains:
            - path: AGENTS.md
              contains: "button"

  - id: config.tsconfig-extends-base
    title: "a tsconfig that extends a base package still resolves the alias"
    kind: config-shape
