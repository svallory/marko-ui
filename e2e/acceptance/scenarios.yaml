  - id: config.unbacked-custom-alias-doctor-fails
    title: "a custom alias nothing backs is a doctor failure (exit 3), not a warning"
    kind: config-shape
    tags: [os:linux, os:macos, kind:alias, speed:fast]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: fast
    ci: { shard: config }
    covers: ["custom alias prefixes", "~ / unbacked alias is a hard failure"]
    notes: >
      This is the 0.5.0 breaking change: an alias that is not @/ or ~/ and that
      nothing backs (tsconfig paths, package imports, workspace export) is a
      failed doctor check. A second custom-alias scenario that IS backed is not
      written — it takes the same branch as config.tsconfig-paths-alias.

      BOTH aliases.components and aliases.ui are rewritten to #custom/*, and the
      assertion pins both, because doctor's alias check reads
      config.aliases.components ONLY (commands/doctor.ts checkAliases, line 349).
      Changing aliases.ui alone leaves aliases.components at @/components, which
      is backed by create-marko's tsconfig — doctor would exit 0 and this
      scenario would pass vacuously.
    steps:
      - use: init-copy-vega-neutral
      - use: add-button
      - name: hand-edit components.json to an alias nothing backs
        command: "@helper"
        helper: unback-alias
        args: ["#custom/*"]
        expect:
          exit: 0
          jsonPath:
            - path: components.json
              pointer: /aliases/components
              equals: "#custom/*"
            - path: components.json
              pointer: /aliases/ui
              equals: "#custom/*"
      - name: doctor fails with exit 3, naming the alias it checked
        command: doctor
        expect:
          exit: 3
          stdoutMatches: ["(?i)#custom/\\*"]
          stdoutContains: "aliases.components"

