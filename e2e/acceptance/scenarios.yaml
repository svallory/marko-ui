# marko-ui acceptance scenarios — the whole suite, as data.
#
# Every scenario here runs the REAL published CLI (or a tarball packed from
# this repo, see defaults.cliTarget) against a REAL project made by a REAL
# scaffolder and installed with a REAL package manager, and asserts observable
# outcomes: exit codes, files written, file contents, and that the app still
# builds.
#
# One scenario per KIND of situation, not per product. If two products exercise
# the same mechanics, one scenario covers the kind and this file says why the
# other was left out (README §Coverage). Every scenario runs most CLI commands
# in order, so a single green run exercises init/add/status/doctor/diff/agents
# against the same project.
#
# Format + how to replay: e2e/acceptance/README.md
# Schema:                e2e/acceptance/scenarios.schema.json
# Validate:              bun run check:acceptance
#
# Annotations:
#   kind:      which axis group this belongs to (must match the scenario's `kind`)
#   speed:     rough wall clock — see README §Timing for the measured table
#   ci:        shard placement; windows-blocking is false everywhere (Windows reports only)

version: 1

defaults:
  cliTarget: published
  version: latest
  registryUrl: https://marko-ui.saulo.tech/r
  timeoutSeconds: 600

# --------------------------------------------------------------------------
# Named multi-line strings reused by pre-steps.
# --------------------------------------------------------------------------
bodies:
  # A plain Marko + Vite app's package.json: no @marko/run, no server adapter.
  marko-vite-no-run-package-json: |
    {
      "name": "app",
      "version": "1.0.0",
      "type": "module",
      "private": true,
      "dependencies": { "marko": "^6.3.42" },
      "devDependencies": {
        "@marko/vite": "^6.1.11",
        "tailwindcss": "^4",
        "@tailwindcss/vite": "^4",
        "vite": "^8.2.1"
      },
      "scripts": { "build": "vite build --app", "dev": "vite" }
    }
  # The create-marko layout, with the CSS import the CLI adds wired in already.
  layout-with-css: |
    import "../styles/globals.css";

    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <title>My app</title>
      </head>
      <body>
        <${content}/>
      </body>
    </html>
  # A tsconfig that maps @/* the way most Vite+Marko projects do.
  tsconfig-with-at-paths: |
    {
      "compilerOptions": {
        "target": "ES2022",
        "module": "ESNext",
        "moduleResolution": "bundler",
        "allowImportingTsExtensions": true,
        "noEmit": true,
        "paths": { "@/*": ["./src/*"] }
      },
      "include": ["src/**/*"]
    }
  # A project that declares its aliases through package.json "imports" only.
  package-json-with-imports: |
    {
      "name": "app",
      "version": "1.0.0",
      "type": "module",
      "private": true,
      "imports": {
        "#ui/*": "./src/components/ui/*",
        "#lib/*": "./src/lib/*"
      },
      "dependencies": { "marko": "^6.3.42" },
      "devDependencies": { "@marko/run": "^0.11.12" }
    }
  jsconfig-with-paths: |
    {
      "compilerOptions": {
        "target": "ES2022",
        "module": "ESNext",
        "moduleResolution": "bundler",
        "noEmit": true,
        "paths": { "@/*": ["./src/*"] }
      },
      "include": ["src/**/*"]
    }
  # A tsconfig that inherits everything from a base package.
  tsconfig-extending-base: |
    {
      "extends": "@tsconfig/node22/tsconfig.json",
      "compilerOptions": {
        "allowImportingTsExtensions": true,
        "noEmit": true,
        "paths": { "~/*": ["./src/*"] }
      },
      "include": ["src/**/*"]
    }
  # An AGENTS.md with human prose on both sides of where the section will land.
  agents-md-with-user-text: |
    # Acceptance app

    How to run this project
    -----------------------
    `bun run dev`, then open the printed URL.

    <!-- the marker section goes here -->

    Do not edit anything below this line.
    It is generated by `bun run build:docs`.
  # A Tailwind v4 entry the user already had, with their own CSS in it.
  own-tailwind-v4-css: |
    @import "tailwindcss";

    body {
      font-family: system-ui, sans-serif;
    }
  # Tailwind v3 project shape: a config file plus a postcss entry.
  tailwind-v3-config-js: |
    /** @type {import('tailwindcss').Config} */
    export default {
      content: ["./src/**/*.{marko,ts}"],
      theme: { extend: {} },
      plugins: [],
    }
  postcss-config-js: |
    export default {
      plugins: { tailwindcss: {}, autoprefixer: {} },
    }
  # A gitignore that ignores .agents — the shape of a project that cloned with
  # skills installed but the skills directory gitignored.
  gitignore-agents: |
    node_modules
    .agents/
  # 0.4.1-era AGENTS.md: no marker block, a Claude-only generated skill dir.
  legacy-agents-md: |
    # My project

    Some notes a human wrote.

    ## marko-ui

    Generated by marko-ui (v0.4.1).
  # A stylesheet carrying the pre-0.5.0 theme with no marked block.
  markerless-theme-css: |
    @import "tailwindcss";

    @theme {
      --color-background: oklch(1 0 0);
    }
  # shadcn's own React components.json — hostile input for the Marko CLI.
  react-shadcn-components-json: |
    {
      "$schema": "https://ui.shadcn.com/schema.json",
      "style": "new-york",
      "rsc": true,
      "tsx": true,
      "tailwind": {
        "config": "tailwind.config.ts",
        "css": "src/app/globals.css",
        "baseColor": "slate",
        "cssVariables": true
      },
      "aliases": {
        "components": "@/components",
        "utils": "@/lib/utils"
      }
    }

# --------------------------------------------------------------------------
# Fixtures — real scaffolds, cached by the runner between scenarios.
# `dir` is where the scaffold lands inside the scenario workspace.
# --------------------------------------------------------------------------
# --------------------------------------------------------------------------
# Helpers — named programs the scenario runs with `{command: "@helper",
# helper: <name>}`. They exist so a scenario says WHAT it is building instead of
# which shell incantation builds it: the runner dev implements each one once,
# from the `description` contract plus `source`, and a reviewer reads the
# description alone. Everything here is real: real files, real layouts, no
# stubs. `cwd` is the default working directory (relative to the scenario
# workspace) when the invoking step does not set its own.
# --------------------------------------------------------------------------
helpers:
  # --- project content -----------------------------------------------------

  wire-button:
    description: >
      Rewrites the app's home route so it imports the just-installed Button
      component from the components alias and renders it with the text
      "Acceptance Button". Exits 0 only when the rewritten route contains both
      the import and the rendered tag; it fails loudly if the route template it
      expects (create-marko's) is not there, so a scaffolder change shows up as
      a helper failure rather than a silently unwired build.
    language: node
    cwd: app
    source: |
      const fs = require("node:fs")
      const route = "src/routes/+page.marko"
      const page = fs.readFileSync(route, "utf8")
      const marker = page.includes("<mouse-mask/>") ? "<mouse-mask/>" : "<!-- anchor -->"
      if (!page.includes(marker)) {
        throw new Error(`no insertion point in ${route}`)
      }
      fs.writeFileSync(
        route,
        'import Button from "../components/ui/button/button.marko";\n\n' +
          page.replace(marker, '<Button variant="outline">Acceptance Button</Button>\n' + marker)
      )

  set-icon-library:
    description: >
      Sets `iconLibrary` in the project's components.json to argv[2] (the only
      argument a caller passes). Exits 0 only if components.json parsed and now
      carries that value, so a caller that forgot to `init` first fails here
      rather than in the next `add`.
    language: node
    cwd: app
    source: |
      const fs = require("node:fs")
      const [library] = process.argv.slice(2)
      if (!library) throw new Error("usage: set-icon-library <library>")
      const config = JSON.parse(fs.readFileSync("components.json", "utf8"))
      config.iconLibrary = library
      fs.writeFileSync("components.json", JSON.stringify(config, null, 2) + "\n")
      if (JSON.parse(fs.readFileSync("components.json", "utf8")).iconLibrary !== library) {
        throw new Error("iconLibrary did not persist")
      }

  unback-alias:
    description: >
      Rewrites `aliases.components` AND `aliases.ui` in the project's
      components.json to the prefix given as argv[2] (e.g. "#custom/*"). Both
      keys are set because `doctor`'s alias check reads `aliases.components` only
      (commands/doctor.ts checkAliases) — changing `aliases.ui` alone leaves
      doctor passing, which is the mistake this scenario exists to prevent.
      Exits 0 only if the file still parses afterwards.
    language: node
    cwd: app
    source: |
      const fs = require("node:fs")
      const [prefix] = process.argv.slice(2)
      if (!prefix) throw new Error("usage: unback-alias <prefix>")
      const config = JSON.parse(fs.readFileSync("components.json", "utf8"))
      config.aliases.components = prefix
      config.aliases.ui = prefix
      fs.writeFileSync("components.json", JSON.stringify(config, null, 2) + "\n")
      JSON.parse(fs.readFileSync("components.json", "utf8"))

  count-markers:
    description: >
      Prints a single integer to stdout: the total number of occurrences of the
      needle (argv[2]) across the files named after it (argv[3..]), each file
      counted relative to the step's cwd. Exists because "exactly one" cannot be
      expressed by contains/notContains without also passing when the marker is
      absent — `stdoutNotContains: "\\n2"` looks right and can never fail. A
      step asserts the number with `stdoutMatches: ["^1$"]` (exactly one) or
      `["^[1-9]\\d*$"]` (at least one). Exits 0 whatever the count is: the count
      IS the assertion, and a missing file contributing 0 is what makes
      `^1$` fail loudly rather than pass vacuously.
    language: node
    cwd: app
    source: |
      const fs = require("node:fs")
      const [needle, ...files] = process.argv.slice(2)
      if (!needle || !files.length) throw new Error("usage: count-markers <needle> <file...>")
      let total = 0
      for (const file of files) {
        try {
          total += fs.readFileSync(file, "utf8").split(needle).length - 1
        } catch {
          // a file that was never created simply contributes 0
        }
      }
      process.stdout.write(String(total))

  # --- monorepo layout -----------------------------------------------------

  make-bun-workspace:
    description: >
      Turns the scaffolded app in $APP into a bun-workspace root: moves the app
      to `apps/web`, writes a root package.json declaring
      `{"workspaces": ["apps/*"], "name": "workspace-root", "private": true}`,
      and runs the workspace's own install so a single `bun.lock` exists at the
      ROOT (the shape the 0.5.0 package-manager-detection fix is about:
      detection walks up to the workspace root). Exits 0 only when both
      `apps/web/package.json` and a root lockfile exist.
    language: node
    cwd: "."
    source: |
      const fs = require("node:fs")
      const path = require("node:path")
      const app = process.env.APP
      if (!app) throw new Error("APP is not set")
      fs.mkdirSync("apps", { recursive: true })
      fs.renameSync(app, path.join("apps", "web"))
      fs.writeFileSync(
        "package.json",
        JSON.stringify(
          { name: "workspace-root", private: true, workspaces: ["apps/*"] },
          null,
          2
        ) + "\n"
      )

  make-npm-workspace:
    description: >
      Same layout as make-bun-workspace, but declares npm's `workspaces` field
      and runs npm's install, so the root has a package-lock.json and no bun
      lockfile. Used by the scenario that asserts init at a workspace ROOT is
      refused with the --cwd instruction.
    language: node
    cwd: "."
    source: |
      const fs = require("node:fs")
      const path = require("node:path")
      const app = process.env.APP
      if (!app) throw new Error("APP is not set")
      fs.mkdirSync("apps", { recursive: true })
      fs.renameSync(app, path.join("apps", "web"))
      fs.writeFileSync(
        "package.json",
        JSON.stringify(
          { name: "workspace-root", private: true, version: "1.0.0", workspaces: ["apps/*"] },
          null,
          2
        ) + "\n"
      )

  make-pnpm-workspace-with-ui:
    description: >
      Builds a pnpm workspace with two packages: the scaffolded Marko app moved
      to `apps/web`, and a new `packages/ui` holding a package.json that depends
      on the app via the `workspace:*` protocol plus its own tsconfig. Runs the
      workspace install so pnpm-lock.yaml sits at the root. This is the "shared
      components package" layout: the components belong in packages/ui and the
      app consumes them, not the reverse.
    language: node
    cwd: "."
    source: |
      const fs = require("node:fs")
      const path = require("node:path")
      const app = process.env.APP
      if (!app) throw new Error("APP is not set")
      fs.mkdirSync("apps", { recursive: true })
      fs.renameSync(app, path.join("apps", "web"))
      fs.writeFileSync(
        "package.json",
        JSON.stringify(
          { name: "workspace-root", private: true, version: "1.0.0", packageManager: "pnpm@9.0.0", workspaces: ["apps/*", "packages/*"] },
          null,
          2
        ) + "\n"
      )
      fs.mkdirSync(path.join("packages", "ui"), { recursive: true })
      fs.writeFileSync(
        path.join("packages", "ui", "package.json"),
        JSON.stringify(
          { name: "@acme/ui", version: "0.0.0", private: true, dependencies: { "@acme/web": "workspace:*" } },
          null,
          2
        ) + "\n"
      )
      fs.writeFileSync(
        path.join("packages", "ui", "tsconfig.json"),
        JSON.stringify({ compilerOptions: { noEmit: true }, include: ["**/*"] }, null, 2) + "\n"
      )

  relocate-config-to-root:
    description: >
      COPIES the app's components.json to the scenario workspace root (the
      "one shared config for the whole monorepo" layout). It copies rather than
      moves on purpose: the app keeps its own package.json, tsconfig and
      stylesheet, and the step asserts that BOTH configs exist afterwards, which
      is the layout under test — one config at the root that every command finds
      via --cwd, alongside the one the app itself was initialized with. Exits 0
      only if the root config exists and still parses.
    language: node
    cwd: "."
    source: |
      const fs = require("node:fs")
      const path = require("node:path")
      const from = path.join(process.env.APP, "components.json")
      fs.copyFileSync(from, "components.json")
      if (!fs.existsSync("components.json")) throw new Error("root components.json missing")

fixtures:
  # The shape the docs Installation page tells users to start from:
  # `bunx create-marko@latest --name my-app --template basic`.
  stock-marko-run:
    scaffold:
      tool: create-marko@latest
      args: ["--name", "app", "--template", "basic", "--no-git", "--yes"]
      dir: app
    pm: bun
    install: true

  # Marko 6 + @marko/vite + Express: the "Marko SSR server" kind.
  marko-vite-express:
    scaffold:
      tool: create-marko@latest
      args: ["--name", "app", "--template", "vite-express", "--no-git", "--yes"]
      dir: app
    pm: bun
    install: true

  # Marko 6 + @marko/vite, no @marko/run. No upstream template exists for this,
  # so it is derived from vite-express by dropping the express server entry.
  marko-vite-no-run:
    fixture: marko-vite-express
    post:
      - label: drop the express server entry, leaving a plain Marko+Vite app
        rm: app/index.ts
      - label: point the build script at vite's app build only
        write:
          path: app/package.json
          body: marko-vite-no-run-package-json

  # Marko 5, class API (`components/` directory + `class { onCreate() }`).
  marko5-class:
    scaffold:
      tool: create-marko@latest
      args:
        ["--name", "app", "--template", "basic-marko-5", "--no-git", "--yes"]
      dir: app
    pm: bun
    install: true

  # A host framework that could host Marko islands but has no Marko yet.
  astro-minimal:
    scaffold:
      tool: create-astro@latest
      args:
        ["app", "--template", "minimal", "--no-git", "--no-install", "--yes"]
      dir: app
    pm: bun
    install: true

  # A plain non-Marko app the CLI must refuse.
  react-vite:
    scaffold:
      tool: create-vite@latest
      args: ["app", "--template", "react-ts"]
      dir: app
    pm: bun
    install: true

  # No package.json at all.
  empty-dir:
    noScaffold: true
    install: false

# --------------------------------------------------------------------------
# Flows — step sequences reused across scenarios. A step `{use: <flow>}` splices
# the whole flow in at that position, so a scenario reads as its own story plus
# the shared spine.
# --------------------------------------------------------------------------
flows:
  # init with every question answered by a flag. The canonical acceptance setup.
  init-copy-vega-neutral:
    - name: "init (copy, vega, neutral, fully non-interactive)"
      command: init
      args:
        [
          "--yes",
          "--base-color",
          "neutral",
          "--distribution",
          "copy",
          "--visual-style",
          "vega",
        ]
      expect:
        exit: 0
        filesExist: ["components.json"]
        fileContains:
          - path: src/styles/globals.css
            contains: "/* marko-ui:theme:start */"
            notContains: "/* marko-ui:theme:end */\n/* marko-ui:theme:start */"

  add-button:
    - name: "add button (copy path)"
      command: add
      args: ["button", "-y"]
      expect:
        exit: 0
        filesExist:
          - src/components/ui/button/button.marko
          - src/components/ui/button/variants.ts
          - src/lib/utils.ts
        fileContains:
          - path: src/components/ui/button/button.marko
            contains: "export type Input"

  add-zag-machine-and-composite:
    - name: "add one zag-machine part and one multi-file composite"
      command: add
      args: ["switch", "dropdown-menu", "-y"]
      expect:
        exit: 0
        filesExist:
          - src/components/ui/switch/switch.marko
          - src/components/ui/dropdown-menu/dropdown-menu.marko
        fileContains:
          # The SSR-safe Zag pattern is a single <zag> tag. A registry still
          # serving <machine-props>/<service>/<connect> means the deploy is stale.
          - path: src/components/ui/switch/switch.marko
            contains: "<zag/api="

  # Every read-only command, after a component is installed. This is the spine.
  verify-clean:
    - name: status lists the installed component
      command: status
      args: ["--json"]
      expect:
        exit: 0
        stdoutContains: '"button"'
    - name: doctor passes
      command: doctor
      expect:
        exit: 0
        stdoutMatches: ["(?i)all checks passed"]
    - name: diff reports no drift right after add
      command: diff
      expect:
        exit: 0
        stdoutMatches: ["(?i)no updates found|up to date"]

  # Build the app and assert the component really rendered. The build alone
  # proves nothing: marko-run emits a server bundle, not prerendered HTML.
  build-and-render-button:
    - name: the app builds
      command: "@app-build"
      expect:
        exit: 0
        appBuild: pass
    - name: the built server renders Button
      command: "@app-render"
      expect:
        exit: 0
        appRender:
          route: /
          status: 200
          contains: ["Acceptance Button", "data-slot=button"]

  agents-sync-and-check:
    - name: agents sync writes AGENTS.md and installs skills
      command: agents
      sub: ["sync"]
      expect:
        exit: 0
        filesExist: ["AGENTS.md", ".agents/skills/marko-ui/SKILL.md"]
    - name: the freshness gate is clean right after sync
      command: agents
      sub: ["sync"]
      args: ["--check"]
      expect:
        exit: 0
        stdoutContains: "up to date"

# --------------------------------------------------------------------------
# Scenarios
# --------------------------------------------------------------------------
scenarios:
  # =========================================================================
  # kind: core — the journeys a real user takes, on the stock create-marko app
  # =========================================================================

  - id: core.init-defaults-copy
    title: "init with no flags on a fresh Marko 6 app uses the documented defaults, then add + build + render"
    kind: core
    tags: [os:linux, os:macos, os:windows, pm:bun, kind:marko-run, speed:medium]
    requires: { os: [linux, macos, windows], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers:
      ["stock @marko/run app", "non-interactive defaults", "copy distribution"]
    steps:
      - name: init --defaults prints what it chose
        command: init
        args: ["--defaults"]
        expect:
          exit: 0
          stdoutContains: "Non-interactive run"
          filesExist:
            - components.json
            - src/styles/globals.css
            - vite.config.ts
          jsonPath:
            - path: components.json
              pointer: /distribution
              equals: copy
            - path: components.json
              pointer: /visualStyle
              equals: vega
            - path: components.json
              pointer: /tailwind/baseColor
              equals: neutral
          fileContains:
            - path: src/styles/globals.css
              contains: '@import "tailwindcss"'
            - path: src/styles/globals.css
              contains: "/* marko-ui:theme:start */"
            - path: src/routes/+layout.marko
              contains: "../styles/globals.css"
            - path: tsconfig.json
              contains: "allowImportingTsExtensions"
      - use: add-button
      - use: verify-clean
      - name: wire Button into the home route
        command: "@helper"
        helper: wire-button
        expect:
          exit: 0
          fileContains:
            - path: src/routes/+page.marko
              contains: "Acceptance Button"
      - use: build-and-render-button

  - id: core.init-explicit-flags
    title: "every init question can be answered by a flag, and the answer is recorded"
    kind: core
    tags: [os:linux, os:macos, os:windows, pm:bun, kind:marko-run, speed:fast]
    requires: { os: [linux, macos, windows], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: fast
    ci: { shard: core }
    covers:
      - "flag-driven init (no prompt)"
      - "the read-only spine: status/doctor/diff all agree after an add"
    notes: >
      The rest of the core scenarios share this setup through the
      init-copy-vega-neutral flow; this one exists because flags and defaults are
      two different code paths (promptForConfig takes the option branch and skips
      the prompt branch entirely). It is also the scenario that stands for the
      "after a plain add, status/doctor/diff all agree the project is healthy"
      situation: the spine is asserted here once, explicitly, rather than
      re-declared as its own duplicate scenario (the `verify-clean` flow splices
      it into every other scenario that installs a component).
    steps:
      - use: init-copy-vega-neutral
      - use: add-button
      - use: verify-clean

  - id: core.init-with-components
    title: "`init button` initializes and installs in one command"
    kind: core
    tags: [os:linux, os:macos, os:windows, pm:bun, kind:marko-run, speed:medium]
    requires: { os: [linux, macos, windows], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers: ["init with component arguments (init + add in one)"]
    steps:
      - name: init with a component on the command line
        command: init
        args: ["button", "-y"]
        expect:
          exit: 0
          filesExist:
            - components.json
            - src/components/ui/button/button.marko
      - use: verify-clean

  - id: core.init-interactive-pty-defaults
    title: "in a real terminal init asks three questions, and Enter x3 equals --defaults"
    kind: core
    tags: [os:linux, os:macos, kind:marko-run, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers: ["interactive pty run", "Enter-through-all == --defaults"]
    notes: >
      Windows has no pty in the node-pty sense we drive, so this scenario is
      linux+macos only and the Windows interactive leg is reported, not
      blocked.

      The point of the scenario is that Enter-through-all-three is EQUIVALENT to
      --defaults, so it does not stop at the config: it adds a component and runs
      the read-only spine afterwards, exactly as core.init-defaults-copy does.
      Asserting only /visualStyle: vega would duplicate that scenario's
      assertion without showing equivalence.
    steps:
      - name: init asks base color, distribution, visual style
        command: init
        stdin: pty
        pty:
          - {
              expect: "base color",
              send: "\r",
              note: "neutral is the initial value",
            }
          - {
              expect: "distribution",
              send: "\r",
              note: "copy is the initial value",
            }
          - {
              expect: "visual style",
