  - id: mono.bun-workspaces-app-dir
    title: "a bun workspace: components.json in the app, CLI run from the app dir"
    kind: monorepo
    tags: [os:linux, os:macos, pm:bun, kind:monorepo, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
      pm: bun
