  - id: pm.yarn-berry
    title: "yarn berry (packageManager field + node-modules linker): the whole loop succeeds"
    kind: package-manager
    tags: [os:linux, os:macos, pm:yarn-berry, kind:marko-run, speed:medium]
    requires:
      { os: [linux, macos], network: both, tools: [yarn, corepack, node] }
    setup:
      fixture: stock-marko-run
      pm: yarn-berry
      install: true
      post:
        - label: "nodeLinker, so the project has a real node_modules to resolve against"
          write:
            path: .yarnrc.yml
            content: |
              nodeLinker: node-modules
        - label: "pin the packageManager field the way corepack expects"
          run: { cmd: "corepack use yarn@4" }
    speed: medium
    ci: { shard: pm }
    covers: ["yarn berry", "the packageManager field"]
    notes: >
      Settled by the operator, and the premise corrected: the CLI NEVER uses
      `yarn dlx`. getPackageRunnerCommand (utils/get-package-manager.ts:102-107)
      returns "pnpm dlx" for pnpm, "bunx" for bun, and "npx" for EVERYTHING
      else — so on a Yarn Berry project the skills relay runs
      `npx -y skills@1.7.0 add …`, which npx handles fine. An earlier revision of
      this scenario asked whether `yarn dlx … -y` was accepted by Yarn 4; that
      was a false premise and there is nothing to ask.

      What this scenario now asserts is the only thing there is to assert: the
      scenario SUCCEEDS. Exit 0 at every step, a buildable project. A failure is
      a bug in the CLI's Yarn support (or in this file's setup), not an open
      question — so there is no unknown-expectation, and the runner must not
      skip it merely because it looks exotic. It is skipped only when corepack or
      yarn is genuinely absent (requires.tools).

      `.yarnrc.yml` sets nodeLinker: node-modules deliberately: PnP (the Berry
      default) changes module resolution enough that it is a different kind of
      situation, and one scenario covers one kind. PnP is listed as deliberately
      uncovered in README §Coverage.
    steps:
      - use: init-copy-vega-neutral
      - use: add-button
      - use: verify-clean
      - name: the app builds under Berry
        command: "@app-build"
        expect:
          exit: 0
          appBuild: pass
      - name: the skills relay succeeds (it goes through npx, not yarn dlx)
        command: agents
        sub: ["sync"]
        expect:
          exit: 0
          filesExist: [".agents/skills/marko-ui/SKILL.md"]

