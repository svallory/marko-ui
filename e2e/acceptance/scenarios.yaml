  - id: pm.yarn-berry
    title: "yarn berry (packageManager field + .yarnrc.yml): full loop"
    kind: package-manager
    tags: [os:linux, os:macos, pm:yarn-berry, kind:marko-run, speed:medium]
    requires:
      { os: [linux, macos], network: both, tools: [yarn, corepack, node] }
    setup:
      fixture: stock-marko-run
      pm: yarn-berry
      install: true
      post:
        - write:
            path: .yarnrc.yml
            content: |
              nodeLinker: node-modules
        - label: "pin the packageManager field the way corepack expects"
          run: { cmd: "corepack use yarn@4" }
    speed: medium
    ci: { shard: pm }
    covers: ["yarn berry", "packageManager field"]
    status: unknown-expectation
    question: >
      get-package-manager.test.ts unit-tests `packageManager: "yarn@4.x"` and
      `bun.lockb`, but no scenario has run a real Yarn Berry project. Under Yarn
      Berry the CLI shells out to `yarn dlx`, which Yarn Berry accepts — but
      Berry also refuses to run scripts it did not resolve from its own lockfile,
      and the skills relay passes `-y` to `skills add` (a flag shaped for npx).
      Question for the lead: is `yarn dlx skills@1.7.0 add ... -y` actually
      accepted by Yarn 4, and does `marko-ui init`'s dependency install succeed
      in a PnP project? Until run once by a human, this scenario asserts init +
      add + verify only, and the runner skips it when corepack is unavailable.
    steps:
      - use: init-copy-vega-neutral
      - use: add-button
      - use: verify-clean

