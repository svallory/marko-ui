  - id: existing.shadcn-components-json
    title: "an existing React shadcn components.json is handled, not half-adopted"
    kind: existing-project
    tags: [os:linux, os:macos, kind:react, speed:fast]
    requires: { os: [linux, macos], network: npm, tools: [bun, node] }
    setup:
      fixture: react-vite
      post:
        - write: { path: components.json, body: react-shadcn-components-json }
    speed: fast
    ci: { shard: existing }
    covers: ["an existing React shadcn components.json"]
    status: unknown-expectation
    question: >
      A React project's components.json parses against the CLI's own schema
      (`style`, `rsc`, `tsx`, `tailwind.*`, `aliases.components`/`utils` are all
      fields marko-ui reads), so every command except init will happily treat a
      React project as a configured Marko one. Only `init` guards, on the
      components.json-exists rule. Should the CLI recognise a React-shaped
      config (tsx: true, an app/ router, a next dependency) and refuse with a
      message pointing at shadcn's own CLI, or is ignoring components.json for a
      non-Marko project acceptable? Until answered, this scenario asserts only
      that init refuses without rewriting the user's file.
    steps:
      - name: init refuses and leaves the React config untouched
        command: init
        args: ["--force", "--defaults"]
        expect:
          exit: [0, 1]
          fileContains:
            - path: components.json
              contains: "ui.shadcn.com/schema.json"

