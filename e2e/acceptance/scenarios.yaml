  - id: kind.marko5-class
    title: "a Marko 5 class-API project is refused: marko-ui requires Marko 6"
    kind: project-kind
    tags: [os:linux, os:macos, kind:marko5, speed:fast]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: marko5-class
    speed: fast
    ci: { shard: kinds }
    covers: ["Marko 5 (class API) project"]
    notes: >
      Settled by the operator, guard landed (fix/cli-guards, main 8c36c2e1): the
      preflight now reads the installed `marko` version and refuses a Marko 5
      project. Before it, `isMarkoProject` (preflights/preflight-init.ts)
      only checked that SOME `marko` dependency was declared, so init happily
      configures a Marko 5 project and writes Marko 6 tags-API source
      (`<zag/api=`, attr-tags) that a Marko 5 compiler cannot consume — the
      failure would not surface until the user's own build. The guard belongs in
      the same preflight as the non-Marko-project check; this scenario is the
      executable statement of what it must do, and the runner SKIPS it until the
      guard lands on fix/cli-guards.

      --force bypasses, exactly as --force bypasses the non-Marko-project check:
      a project this detector misreads is precisely what --force is the escape
      hatch for.
    steps:
      - name: init refuses and names the version requirement
        command: init
        args: ["--yes"]
        expect:
          exit: 1
          stdoutMatches: ["(?i)marko-ui requires marko 6"]
          stdoutContains: "--force"
          filesAbsent: ["components.json", "AGENTS.md"]
      - name: the preflight wrote nothing into the Marko 5 project
        command: "@helper"
        helper: count-markers
        args: ["components.json", "package.json"]
        expect:
          exit: 0
          stdoutMatches: ["^0$"]
      - name: --force bypasses the version guard and configures the project
        command: init
        args: ["--yes", "--force"]
        expect:
          exit: 0
          filesExist: ["components.json"]
          jsonPath:
            - path: components.json
              pointer: /distribution
              equals: copy

