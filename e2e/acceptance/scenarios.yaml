        - label: turn the app into a bun workspace root with apps/web inside it
          cwd: "."
          helper: make-bun-workspace
    speed: medium
    ci: { shard: mono }
    covers:
      [
        "bun workspaces",
        "components.json in the app",
        "run from inside the app",
      ]
    # make-bun-workspace moves the app to apps/web, so the scenario's default
    # step cwd (normally the fixture's app dir) names where it now is.
    cwd: apps/web
    steps:
      - name: init inside apps/web
        command: init
        args: ["--yes"]
        cwd: apps/web
        expect:
          exit: 0
          filesExist: ["components.json"]
      - use: add-button
      - name: nothing was written at the workspace root
        command: "@shell"
        args: ["test", "!", "-e", "../../components.json"]
