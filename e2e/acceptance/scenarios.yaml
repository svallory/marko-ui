  - id: env.custom-registry-url
    title: "REGISTRY_URL points the whole flow at a different registry"
    kind: environment
    tags: [os:linux, os:macos, kind:registry, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: env }
    covers: ["custom registry URL"]
    notes: >
      The runner serves a copy of the published registry JSON from a local static
      server and the scenario points REGISTRY_URL at it for BOTH the init and the
      add, so the URL is proved honoured end to end — the components that land
      can only have come from the mirror.

      Note there is deliberately NO assertion that components.json records
      @marko-ui anywhere. The built-in registry is never written to the config:
      filterBuiltinRegistries (commands/init.ts) strips it, and
      assertNoBuiltinRegistryOverride (utils/get-config.ts) rejects any config
      that tries to define it. Earlier revisions of this scenario asserted
      `/registries/@marko-ui` existed, which cannot be true.
    steps:
      - name: init against a local mirror
        command: init
        args: ["--yes"]
        env: { REGISTRY_URL: "http://127.0.0.1:$ACCEPTANCE_MIRROR_PORT/r" }
        expect:
          exit: 0
          filesExist: ["components.json", "src/styles/globals.css"]
      - name: add from the same mirror
        command: add
        args: ["button", "-y"]
        expect:
          exit: 0
          filesExist: ["src/components/ui/button/button.marko"]
      - use: verify-clean

  - id: env.offline-no-skill
    title: "agents sync --no-skill works with the network cut"
    kind: environment
    tags: [os:linux, os:macos, kind:offline, speed:fast]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: fast
    ci: { shard: env }
    covers: ["offline", "descriptions are best-effort"]
    notes: >
      `requires.network` is `both` because the first two steps run init and add
      against the live registry and npm — that is the point: the project is
      fully set up and only the FINAL step is cut. `offline` is a per-step
      switch, so it applies to the agents sync below and to nothing else in this
      scenario; the validator rejects it only where it would contradict the step
      itself (an @http step, or args naming $REGISTRY_URL). An earlier schema
      description claimed offline required a scenario-level network constraint
      that did not hold here; the rule is now the one the file actually follows.
    steps:
      - use: init-copy-vega-neutral
      - use: add-button
      - name: sync --no-skill with no network
        command: agents
        sub: ["sync"]
        args: ["--no-skill"]
        offline: true
        expect:
          exit: 0
          filesExist: ["AGENTS.md"]
          fileContains:
            - path: AGENTS.md
              contains: "button"

