    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
      post:
        - run: { cmd: "bun add -d @tsconfig/node22" }
        - write: { path: tsconfig.json, body: tsconfig-extending-base }
    speed: medium
