        - write: { path: src/styles/globals.css, body: own-tailwind-v4-css }
        - write:
            path: vite.config.ts
            content: |
              import { defineConfig } from "vite"
              import tailwindcss from "@tailwindcss/vite"

              export default defineConfig({
                plugins: [tailwindcss()],
              })
        - label: the layout already imports the stylesheet
          write:
            path: src/routes/+layout.marko
            body: layout-with-css
    speed: medium
    ci: { shard: existing }
    covers: ["Tailwind v4 already set up with its own CSS"]
    steps:
      - name: init reuses the stylesheet and does not create a second one
        command: init
        args: ["--yes"]
        expect:
          exit: 0
          jsonPath:
            - path: components.json
              pointer: /tailwind/css
              equals: src/styles/globals.css
          fileContains:
            - path: src/styles/globals.css
              contains: "font-family: system-ui"
            - path: src/styles/globals.css
              contains: "/* marko-ui:theme:start */"
          filesAbsent: ["src/styles/app.css", "src/styles/tailwind.css"]
      - use: add-button
      - use: verify-clean

  - id: existing.tailwind-v3-config
    title: "a Tailwind v3 project is refused: marko-ui needs Tailwind v4"
    kind: existing-project
    tags: [os:linux, os:macos, kind:tailwind, speed:fast]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
      post:
        - run: { cmd: "bun add -d tailwindcss@3 postcss autoprefixer" }
        - write: { path: tailwind.config.js, body: tailwind-v3-config-js }
        - write: { path: postcss.config.js, body: postcss-config-js }
    speed: fast
    ci: { shard: existing }
    covers: ["Tailwind v3 config"]
    notes: >
      Settled by the operator; the guard landed on fix/cli-guards (main
      8c36c2e1) and the scenario is asserted, not skipped. Before it, the CLI
      accepted a v3 project and silently upgraded its build.

      What the guard must do, from the code: getProjectTailwindVersionFromConfig
      already reads the installed version, so the check belongs where init runs
      its preflights. The refusal names Tailwind v4 as the requirement and
      points at `npx @tailwindcss/upgrade` executed with the project's own
      package manager, and --force bypasses it exactly as --force bypasses the
      non-Marko-project check.
    steps:
      - name: init refuses and names the upgrade path
        command: init
        args: ["--yes"]
        expect:
          exit: 1
          stdoutMatches: ["(?i)tailwind v4"]
          stdoutContains: ["@tailwindcss/upgrade", "--force"]
          filesAbsent: ["components.json"]
      - name: the project's own config files are left alone
        command: "@helper"
        helper: count-markers
        args: ["content", "tailwind.config.js"]
        expect:
          exit: 0
          stdoutMatches: ["^[1-9]\\d*$"]
          filesExist: ["tailwind.config.js", "postcss.config.js"]
      - name: --force bypasses the guard and initializes normally
        command: init
        args: ["--yes", "--force"]
        expect:
          exit: 0
          filesExist: ["components.json"]
          jsonPath:
            - path: components.json
              pointer: /tailwind/config
              equals: ""
            - path: components.json
              pointer: /distribution
              equals: copy

  - id: existing.multiple-css-entries
    title: "two candidate stylesheets: init uses exactly one, and leaves the other untouched"
    kind: existing-project
    tags: [os:linux, os:macos, kind:tailwind, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
      post:
        - run: { cmd: "bun add -d tailwindcss @tailwindcss/vite" }
        - write: { path: src/styles/globals.css, body: own-tailwind-v4-css }
        - write:
            { path: src/styles/admin.css, content: '@import "tailwindcss";\n' }
    speed: medium
    ci: { shard: existing }
    covers: ["unusual or multiple CSS entries"]
    notes: >
      WHICH file init picks is deliberately NOT asserted. getTailwindCssFile
      (utils/get-project-info.ts) globs `**/*.{css,scss}` and returns the first
      match, and fast-glob's traversal order is filesystem-dependent — asserting
      the winner would make this scenario flaky across CI machines for no
      coverage gain. What must hold, and is asserted: exactly ONE theme block
      exists across both candidates, both files survive, the user's own CSS in
      each is intact, and no THIRD stylesheet was invented.
    steps:
      - name: init writes a config naming a stylesheet under src/styles
        command: init
        args: ["--yes"]
        expect:
          exit: 0
          filesExist: ["components.json"]
          stdoutMatches: ["(?i)src/styles/[a-z-]+\\.css"]
          filesAbsent: ["src/styles/app.css"]
      - name: exactly one of the two candidates carries the theme block
        command: "@helper"
        helper: count-markers
        args:
          [
            "/* marko-ui:theme:start */",
            "src/styles/globals.css",
            "src/styles/admin.css",
          ]
        expect:
          exit: 0
          stdoutMatches: ["^1$"]
      - name: the user's own CSS survived in both files
        command: "@helper"
        helper: count-markers
        args:
          [
            '@import "tailwindcss"',
            "src/styles/globals.css",
            "src/styles/admin.css",
          ]
        expect:
          exit: 0
          stdoutMatches: ["^2$"]
      - use: add-button
      - use: verify-clean

  - id: existing.component-name-collision
