  - id: existing.tailwind-v4-own-css
    title: "an existing Tailwind v4 entry with the user's own CSS is reused, not replaced"
    kind: existing-project
    tags: [os:linux, os:macos, kind:tailwind, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
      post:
        - label: the user already wired Tailwind v4 by hand
          run: { cmd: "bun add -d tailwindcss @tailwindcss/vite" }
        - write: { path: src/styles/globals.css, body: own-tailwind-v4-css }
        - write:
            path: vite.config.ts
            content: |
              import { defineConfig } from "vite"
              import tailwindcss from "@tailwindcss/vite"

              export default defineConfig({
                plugins: [tailwindcss()],
              })
        - label: the layout already imports the stylesheet
          write:
            path: src/routes/+layout.marko
            body: layout-with-css
    speed: medium
    ci: { shard: existing }
    covers: ["Tailwind v4 already set up with its own CSS"]
    steps:
      - name: init reuses the stylesheet and does not create a second one
        command: init
        args: ["--yes"]
        expect:
          exit: 0
          jsonPath:
            - path: components.json
              pointer: /tailwind/css
              equals: src/styles/globals.css
          fileContains:
            - path: src/styles/globals.css
              contains: "font-family: system-ui"
            - path: src/styles/globals.css
              contains: "/* marko-ui:theme:start */"
          filesAbsent: ["src/styles/app.css", "src/styles/tailwind.css"]
      - use: add-button
      - use: verify-clean

  - id: existing.tailwind-v3-config
    title: "a Tailwind v3 project with its own config file still initializes"
    kind: existing-project
    tags: [os:linux, os:macos, kind:tailwind, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
      post:
        - run: { cmd: "bun add -d tailwindcss@3 postcss autoprefixer" }
        - write: { path: tailwind.config.js, body: tailwind-v3-config-js }
        - write: { path: postcss.config.js, body: postcss-config-js }
    speed: medium
    ci: { shard: existing }
    covers: ["Tailwind v3 config"]
    status: unknown-expectation
    question: >
      What does `init` do in a project whose package.json depends on
      tailwindcss@^3 and which ships a tailwind.config.js? getProjectTailwindVersionFromConfig()
      reads the version and update-css-vars.ts has a `v4` plugin branch, so the
      CLI is aware of v3 — but init installs tailwindcss@^4 + @tailwindcss/vite
      unconditionally and the docs only ever describe Tailwind v4. Is a v3
      project supported (init should keep v3 and write v3-shaped theme tokens),
      or out of scope (init upgrades the project to v4, which is a destructive
      change to a user's build)? This scenario asserts only that init does not
      crash and writes a components.json whose tailwind.config points at the
      existing file.
    steps:
      - name: init does not crash and records the existing tailwind config
        command: init
        args: ["--yes"]
        expect:
          exit: 0
          filesExist: ["components.json"]
          jsonPath:
            - path: components.json
              pointer: /tailwind/config
              equals: tailwind.config.js
      - use: add-button

