          exit: 0
      - use: verify-clean

  - id: mono.root-components-json-cwd-flag
    title: "a monorepo with components.json at the ROOT, every command driven from the root with --cwd"
    kind: monorepo
    tags: [os:linux, os:macos, pm:bun, kind:monorepo, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
      pm: bun
      install: true
      post:
        - label: turn the app into a bun workspace root with apps/web inside it
          cwd: "."
          helper: make-bun-workspace
    speed: medium
    ci: { shard: mono }
    covers:
      [
        "components.json at the workspace root",
        "--cwd from the repo root",
        "the root lockfile drives the package manager",
      ]
    notes: >
      The "one shared config for the whole monorepo" leg: the app is configured
      normally first, then its components.json is hoisted to the root, and every
      later command is issued from the ROOT with --cwd pointing back at the app.
      This is the other half of mono.bun-workspaces-app-dir (config in the app,
      CLI run from inside it) and the pair between them covers "components.json
      at the root vs in the app, run from root with --cwd vs inside the app".
    steps:
      - name: init into the app first, so there is a config to hoist
        command: init
        args: ["--yes", "--cwd", "apps/web"]
        cwd: .
        expect:
          exit: 0
          filesExist: ["apps/web/components.json"]
          filesAbsent: ["components.json"]
      - name: copy the config to the workspace root
        command: "@helper"
        helper: relocate-config-to-root
        cwd: "."
        expect:
          exit: 0
          filesExist: ["components.json", "apps/web/components.json"]
      - name: add from the repo root with --cwd resolves the app's aliases through the root config
        command: add
