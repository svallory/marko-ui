# marko-ui acceptance scenarios — the whole suite, as data.
#
# Every scenario here runs the REAL published CLI (or a tarball packed from
# this repo, see defaults.cliTarget) against a REAL project made by a REAL
# scaffolder and installed with a REAL package manager, and asserts observable
# outcomes: exit codes, files written, file contents, and that the app still
# builds.
#
# One scenario per KIND of situation, not per product. If two products exercise
# the same mechanics, one scenario covers the kind and this file says why the
# other was left out (README §Coverage). Every scenario runs most CLI commands
# in order, so a single green run exercises init/add/status/doctor/diff/agents
# against the same project.
#
# Format + how to replay: e2e/acceptance/README.md
# Schema:                e2e/acceptance/scenarios.schema.json
# Validate:              bun run check:acceptance
#
# Annotations:
#   kind:      which axis group this belongs to (must match the scenario's `kind`)
#   speed:     rough wall clock — see README §Timing for the measured table
#   ci:        shard placement; windows-blocking is false everywhere (Windows reports only)

version: 1

defaults:
  cliTarget: published
  version: latest
  registryUrl: https://marko-ui.saulo.tech/r
  timeoutSeconds: 600

# --------------------------------------------------------------------------
# Named multi-line strings reused by pre-steps.
# --------------------------------------------------------------------------
bodies:
  # A plain Marko + Vite app's package.json: no @marko/run, no server adapter.
  marko-vite-no-run-package-json: |
    {
      "name": "app",
      "version": "1.0.0",
      "type": "module",
      "private": true,
      "dependencies": { "marko": "^6.3.42" },
      "devDependencies": {
        "@marko/vite": "^6.1.11",
        "tailwindcss": "^4",
        "@tailwindcss/vite": "^4",
        "vite": "^8.2.1"
      },
      "scripts": { "build": "vite build --app", "dev": "vite" }
    }
  # The create-marko layout, with the CSS import the CLI adds wired in already.
  layout-with-css: |
    import "../styles/globals.css";

    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <title>My app</title>
      </head>
      <body>
        <${content}/>
      </body>
    </html>
  # A tsconfig that maps @/* the way most Vite+Marko projects do.
  tsconfig-with-at-paths: |
    {
      "compilerOptions": {
        "target": "ES2022",
        "module": "ESNext",
        "moduleResolution": "bundler",
        "allowImportingTsExtensions": true,
        "noEmit": true,
        "paths": { "@/*": ["./src/*"] }
      },
      "include": ["src/**/*"]
    }
  # A project that declares its aliases through package.json "imports" only.
  package-json-with-imports: |
    {
      "name": "app",
      "version": "1.0.0",
      "type": "module",
      "private": true,
      "imports": {
        "#ui/*": "./src/components/ui/*",
        "#lib/*": "./src/lib/*"
      },
      "dependencies": { "marko": "^6.3.42" },
      "devDependencies": { "@marko/run": "^0.11.12" }
    }
  jsconfig-with-paths: |
    {
      "compilerOptions": {
        "target": "ES2022",
        "module": "ESNext",
        "moduleResolution": "bundler",
        "noEmit": true,
        "paths": { "@/*": ["./src/*"] }
      },
      "include": ["src/**/*"]
    }
  # A tsconfig that inherits everything from a base package.
  tsconfig-extending-base: |
    {
      "extends": "@tsconfig/node22/tsconfig.json",
      "compilerOptions": {
        "allowImportingTsExtensions": true,
        "noEmit": true,
        "paths": { "~/*": ["./src/*"] }
      },
      "include": ["src/**/*"]
    }
  # An AGENTS.md with human prose on both sides of where the section will land.
  agents-md-with-user-text: |
    # Acceptance app

    How to run this project
    -----------------------
    `bun run dev`, then open the printed URL.

    <!-- the marker section goes here -->

    Do not edit anything below this line.
    It is generated by `bun run build:docs`.
  # A Tailwind v4 entry the user already had, with their own CSS in it.
  own-tailwind-v4-css: |
    @import "tailwindcss";

    body {
      font-family: system-ui, sans-serif;
    }
  # Tailwind v3 project shape: a config file plus a postcss entry.
  tailwind-v3-config-js: |
    /** @type {import('tailwindcss').Config} */
    export default {
      content: ["./src/**/*.{marko,ts}"],
      theme: { extend: {} },
      plugins: [],
    }
  postcss-config-js: |
    export default {
      plugins: { tailwindcss: {}, autoprefixer: {} },
    }
  # A gitignore that ignores .agents — the shape of a project that cloned with
  # skills installed but the skills directory gitignored.
  gitignore-agents: |
    node_modules
    .agents/
  # 0.4.1-era AGENTS.md: no marker block, a Claude-only generated skill dir.
  legacy-agents-md: |
    # My project

    Some notes a human wrote.

    ## marko-ui

    Generated by marko-ui (v0.4.1).
  # A stylesheet carrying the pre-0.5.0 theme with no marked block.
  markerless-theme-css: |
    @import "tailwindcss";

    @theme {
      --color-background: oklch(1 0 0);
    }
  # shadcn's own React components.json — hostile input for the Marko CLI.
  react-shadcn-components-json: |
    {
      "$schema": "https://ui.shadcn.com/schema.json",
      "style": "new-york",
      "rsc": true,
      "tsx": true,
      "tailwind": {
        "config": "tailwind.config.ts",
        "css": "src/app/globals.css",
        "baseColor": "slate",
        "cssVariables": true
      },
      "aliases": {
        "components": "@/components",
        "utils": "@/lib/utils"
      }
    }

# --------------------------------------------------------------------------
# Fixtures — real scaffolds, cached by the runner between scenarios.
# `dir` is where the scaffold lands inside the scenario workspace.
# --------------------------------------------------------------------------
fixtures:
  # The shape the docs Installation page tells users to start from:
  # `bunx create-marko@latest --name my-app --template basic`.
  stock-marko-run:
    scaffold:
      tool: create-marko@latest
      args: ["--name", "app", "--template", "basic", "--no-git", "--yes"]
      dir: app
    pm: bun
    install: true

  # Marko 6 + @marko/vite + Express: the "Marko SSR server" kind.
  marko-vite-express:
    scaffold:
      tool: create-marko@latest
      args: ["--name", "app", "--template", "vite-express", "--no-git", "--yes"]
      dir: app
    pm: bun
    install: true

  # Marko 6 + @marko/vite, no @marko/run. No upstream template exists for this,
  # so it is derived from vite-express by dropping the express server entry.
  marko-vite-no-run:
    fixture: marko-vite-express
    post:
      - label: drop the express server entry, leaving a plain Marko+Vite app
        rm: app/index.ts
      - label: point the build script at vite's app build only
        write:
          path: app/package.json
          body: marko-vite-no-run-package-json

  # Marko 5, class API (`components/` directory + `class { onCreate() }`).
  marko5-class:
    scaffold:
      tool: create-marko@latest
      args:
        ["--name", "app", "--template", "basic-marko-5", "--no-git", "--yes"]
      dir: app
    pm: bun
    install: true

  # A host framework that could host Marko islands but has no Marko yet.
  astro-minimal:
    scaffold:
      tool: create-astro@latest
      args:
        ["app", "--template", "minimal", "--no-git", "--no-install", "--yes"]
      dir: app
    pm: bun
    install: true

  # A plain non-Marko app the CLI must refuse.
  react-vite:
    scaffold:
      tool: create-vite@latest
      args: ["app", "--template", "react-ts"]
      dir: app
    pm: bun
    install: true

  # No package.json at all.
  empty-dir:
    noScaffold: true
    install: false

# --------------------------------------------------------------------------
# Flows — step sequences reused across scenarios. A step `{use: <flow>}` splices
# the whole flow in at that position, so a scenario reads as its own story plus
# the shared spine.
# --------------------------------------------------------------------------
flows:
  # init with every question answered by a flag. The canonical acceptance setup.
  init-copy-vega-neutral:
    - name: "init (copy, vega, neutral, fully non-interactive)"
      command: init
      args:
        [
          "--yes",
          "--base-color",
          "neutral",
          "--distribution",
          "copy",
          "--visual-style",
          "vega",
        ]
      expect:
        exit: 0
        filesExist: ["components.json"]
        fileContains:
          - path: src/styles/globals.css
            contains: "/* marko-ui:theme:start */"
            notContains: "/* marko-ui:theme:end */\n/* marko-ui:theme:start */"

  add-button:
    - name: "add button (copy path)"
      command: add
      args: ["button", "-y"]
      expect:
        exit: 0
        filesExist:
          - src/components/ui/button/button.marko
          - src/components/ui/button/variants.ts
          - src/lib/utils.ts
        fileContains:
          - path: src/components/ui/button/button.marko
            contains: "export interface Input"

  add-zag-machine-and-composite:
    - name: "add one zag-machine part and one multi-file composite"
      command: add
      args: ["switch", "dropdown-menu", "-y"]
      expect:
        exit: 0
        filesExist:
          - src/components/ui/switch/switch.marko
          - src/components/ui/dropdown-menu/dropdown-menu.marko
        fileContains:
          # The SSR-safe Zag pattern is a single <zag> tag. A registry still
          # serving <machine-props>/<service>/<connect> means the deploy is stale.
          - path: src/components/ui/switch/switch.marko
            contains: "<zag/api="

  # Every read-only command, after a component is installed. This is the spine.
  verify-clean:
    - name: status lists the installed component
      command: status
      args: ["--json"]
      expect:
        exit: 0
        stdoutContains: '"button"'
    - name: doctor passes
      command: doctor
      expect:
        exit: 0
        stdoutMatches: ["(?i)all checks passed"]
    - name: diff reports no drift right after add
      command: diff
      expect:
        exit: 0
        stdoutMatches: ["(?i)no updates found|up to date"]

  # Build the app and assert the component really rendered. The build alone
  # proves nothing: marko-run emits a server bundle, not prerendered HTML.
  build-and-render-button:
    - name: the app builds
      command: "@app-build"
      expect:
        exit: 0
        appBuild: pass
    - name: the built server renders Button
      command: "@app-render"
      expect:
        exit: 0
        appRender:
          route: /
          status: 200
          contains: ["Acceptance Button", "data-slot=button"]

  agents-sync-and-check:
    - name: agents sync writes AGENTS.md and installs skills
      command: agents
      sub: ["sync"]
      expect:
        exit: 0
        filesExist: ["AGENTS.md", ".agents/skills/marko-ui/SKILL.md"]
    - name: the freshness gate is clean right after sync
      command: agents
      sub: ["sync"]
      args: ["--check"]
      expect:
        exit: 0
        stdoutContains: "up to date"

# --------------------------------------------------------------------------
# Scenarios
# --------------------------------------------------------------------------
scenarios:
  # =========================================================================
  # kind: core — the journeys a real user takes, on the stock create-marko app
  # =========================================================================

  - id: core.init-defaults-copy
    title: "init with no flags on a fresh Marko 6 app uses the documented defaults, then add + build + render"
    kind: core
    tags: [os:linux, os:macos, os:windows, pm:bun, kind:marko-run, speed:medium]
    requires: { os: [linux, macos, windows], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers:
      ["stock @marko/run app", "non-interactive defaults", "copy distribution"]
    steps:
      - name: init --defaults prints what it chose
        command: init
        args: ["--defaults"]
        expect:
          exit: 0
          stdoutContains: "Non-interactive run"
          filesExist:
            - components.json
            - src/styles/globals.css
            - vite.config.ts
          jsonPath:
            - path: components.json
              pointer: /distribution
              equals: copy
            - path: components.json
              pointer: /visualStyle
              equals: vega
            - path: components.json
              pointer: /tailwind/baseColor
              equals: neutral
          fileContains:
            - path: src/styles/globals.css
              contains: '@import "tailwindcss"'
            - path: src/styles/globals.css
              contains: "/* marko-ui:theme:start */"
            - path: src/routes/+layout.marko
              contains: "../styles/globals.css"
            - path: tsconfig.json
              contains: "allowImportingTsExtensions"
      - use: add-button
      - use: verify-clean
      - name: wire Button into the home route
        command: "@shell"
        args: ["node", "-e", "wire-button"]
        expect:
          exit: 0
          fileContains:
            - path: src/routes/+page.marko
              contains: "Acceptance Button"
      - use: build-and-render-button

  - id: core.init-explicit-flags
    title: "every init question can be answered by a flag, and the answer is recorded"
    kind: core
    tags: [os:linux, os:macos, os:windows, pm:bun, kind:marko-run, speed:fast]
    requires: { os: [linux, macos, windows], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: fast
    ci: { shard: core }
    covers: ["flag-driven init (no prompt)"]
    notes: >
      The rest of the core scenarios share this setup through the
      init-copy-vega-neutral flow; this one exists because flags and defaults are
      two different code paths (promptForConfig takes the option branch and skips
      the prompt branch entirely).
    steps:
      - use: init-copy-vega-neutral
      - use: add-button
      - use: verify-clean

  - id: core.init-with-components
    title: "`init button` initializes and installs in one command"
    kind: core
    tags: [os:linux, os:macos, os:windows, pm:bun, kind:marko-run, speed:medium]
    requires: { os: [linux, macos, windows], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers: ["init with component arguments (init + add in one)"]
    steps:
      - name: init with a component on the command line
        command: init
        args: ["button", "-y"]
        expect:
          exit: 0
          filesExist:
            - components.json
            - src/components/ui/button/button.marko
      - use: verify-clean

  - id: core.init-interactive-pty-defaults
    title: "in a real terminal init asks three questions, and Enter x3 equals --defaults"
    kind: core
    tags: [os:linux, os:macos, kind:marko-run, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers: ["interactive pty run", "Enter-through-all == --defaults"]
    notes: >
      Windows has no pty in the node-pty sense we drive; the Windows leg of
      interactive init is covered by the `core.init-interactive-pty-choices`
      scenario's windows-blocking:false entry instead of a duplicate here.
    steps:
      - name: init asks base color, distribution, visual style
        command: init
        stdin: pty
        pty:
          - {
              expect: "base color",
              send: "\r",
              note: "neutral is the initial value",
            }
          - {
              expect: "distribution",
              send: "\r",
              note: "copy is the initial value",
            }
          - {
              expect: "visual style",
              send: "\r",
              note: "vega is the initial value",
            }
        expect:
          exit: 0
          stdoutNotContains: "Non-interactive run"
          jsonPath:
            - path: components.json
              pointer: /visualStyle
              equals: vega

  - id: core.init-interactive-pty-choices
    title: "in a real terminal the arrow keys choose a non-default base color and visual style"
    kind: core
    tags: [os:linux, os:macos, kind:marko-run, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers: ["interactive pty run", "non-default answers are honoured"]
    steps:
      - name: pick slate (index 2) and maia (index 4)
        command: init
        stdin: pty
        pty:
          - {
              expect: "base color",
              send: "\u001b[B\u001b[B\r",
              note: "neutral -> slate",
            }
          - { expect: "distribution", send: "\r" }
          - {
              expect: "visual style",
              send: "\u001b[B\u001b[B\r",
              note: "vega -> maia",
            }
        expect:
          exit: 0
          jsonPath:
            - path: components.json
              pointer: /tailwind/baseColor
              equals: slate
            - path: components.json
              pointer: /visualStyle
              equals: maia
      - name: the theme block reflects the chosen base color
        command: "@shell"
        args: ["grep", "-c", "--", "--slate-", "src/styles/globals.css"]
        expect:
          exit: 0
          stdoutNotContains: "\n0"

  - id: core.add-zag-machine-and-composite
    title: "add a zag-machine part and a multi-file composite, then build and render"
    kind: core
    tags: [os:linux, os:macos, os:windows, pm:bun, kind:marko-run, speed:medium]
    requires: { os: [linux, macos, windows], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers: ["zag machine component", "composite component (many files)"]
    steps:
      - use: init-copy-vega-neutral
      - use: add-zag-machine-and-composite
      - use: verify-clean
      - use: build-and-render-button

  - id: core.add-multiple-at-once
    title: "add resolves registry dependencies across three components in one command"
    kind: core
    tags: [os:linux, os:macos, pm:bun, kind:marko-run, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers: ["multi-component add", "registry dependency resolution"]
    steps:
      - use: init-copy-vega-neutral
      - name: add three components with an overlapping dependency
        command: add
        args: ["dialog", "select", "toast", "-y"]
        expect:
          exit: 0
          filesExist:
            - src/components/ui/dialog/dialog.marko
            - src/components/ui/select/select.marko
            - src/components/ui/toast/toast.marko
      - use: verify-clean

  - id: core.full-agent-loop
    title: "init --agents, add, then the freshness gate goes red until sync runs again"
    kind: core
    tags: [os:linux, os:macos, kind:marko-run, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node, git] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers: ["agent onboarding", "AGENTS.md staleness gate", "skills install"]
    notes: >
      The exit-3 between add and sync is correct, not a defect: add really did
      change the installed-components list that init --agents wrote as a
      placeholder. Verified live against 0.5.0 (scratch/team-lead/reports/accept-050.md).
    steps:
      - name: init --agents on a fresh project
        command: init
        args: ["--agents"]
        expect:
          exit: 0
          filesExist:
            - components.json
            - AGENTS.md
            - .agents/skills/marko-ui/SKILL.md
            - .agents/skills/marko6/SKILL.md
            - .agents/skills/marko-run/SKILL.md
          fileContains:
            - path: AGENTS.md
              contains: "<!-- marko-ui:start -->"
      - use: add-button
      - name: --check is stale right after add
        command: agents
        sub: ["sync"]
        args: ["--check"]
        expect:
          exit: 3
          stdoutContains: "stale"
      - use: agents-sync-and-check
      - name: AGENTS.md now lists the component
        command: status
        expect:
          exit: 0
          stdoutContains: "button"

  - id: core.status-doctor-diff-clean
    title: "after a plain add, status/doctor/diff all agree the project is healthy"
    kind: core
    tags: [os:linux, os:macos, os:windows, pm:bun, kind:marko-run, speed:medium]
    requires: { os: [linux, macos, windows], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers: ["read-only command spine"]
    steps:
      - use: init-copy-vega-neutral
      - use: add-button
      - use: verify-clean

  - id: core.read-commands-search-show-docs
    title: "search, show and docs answer from the live registry before anything is installed"
    kind: core
    tags: [os:linux, os:macos, os:windows, kind:registry, speed:fast]
    requires:
      {
        os: [linux, macos, windows],
        network: registry-only,
        tools: [bun, node],
      }
    setup:
      fixture: stock-marko-run
    speed: fast
    ci: { shard: core }
    covers:
      [
        "search",
        "show",
        "docs",
        "registry-backed commands with no components.json",
      ]
    notes: search/show/docs work against a registry with no components.json present, so this scenario needs no init.
    steps:
      - name: search finds items
        command: search
        args: ["--query", "button", "--json"]
        expect:
          exit: 0
          stdoutContains: '"button"'
      - name: show lists files and deps
        command: show
        args: ["button", "--files"]
        expect:
          exit: 0
          stdoutContains: "button.marko"
      - name: docs prints markdown
        command: docs
        args: ["button"]
        expect:
          exit: 0
          stdoutMatches: ["(?i)^# Button"]
      - use: init-copy-vega-neutral
      - use: add-button
      - use: verify-clean

  - id: core.manifest-and-registry-list
    title: "manifest describes the whole CLI and registry list resolves the configured registries"
    kind: core
    tags: [os:linux, os:macos, os:windows, kind:registry, speed:fast]
    requires:
      {
        os: [linux, macos, windows],
        network: registry-only,
        tools: [bun, node],
      }
    setup:
      fixture: stock-marko-run
    speed: fast
    ci: { shard: core }
    covers: ["manifest", "registry list", "registry add/remove"]
    steps:
      - name: manifest is machine-readable and lists the whole CLI
        command: manifest
        expect:
          exit: 0
          jsonPath:
            - { source: stdout, pointer: "/commands", equals: "<exists>" }
      - use: init-copy-vega-neutral
      - name: registry list resolves the built-in @marko-ui registry
        command: registry
        sub: ["list"]
        expect:
          exit: 0
          stdoutContains: "@marko-ui"
      - name: registry add writes a namespaced entry into components.json
        command: registry
        sub: ["add"]
        args: ["@acme=https://example.invalid/r/{name}.json"]
        expect:
          exit: 0
          jsonPath:
            - path: components.json
              pointer: /registries/@acme
              equals: "<exists>"
      - name: registry remove takes it back out
        command: registry
        sub: ["remove"]
        args: ["@acme"]
        expect:
          exit: 0
          filesExist: ["components.json"]
      - use: add-button
      - use: verify-clean

  - id: core.add-unknown-component
    title: "add names the component it could not find and exits 1"
    kind: core
    tags: [os:linux, os:macos, os:windows, kind:marko-run, speed:medium]
    requires: { os: [linux, macos, windows], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: core }
    covers: ["unknown component name", "refusal without a partial write"]
    steps:
      - use: init-copy-vega-neutral
      - name: add a name that is not in the registry
        command: add
        args: ["definitely-not-a-component", "-y"]
        expect:
          exit: [1, 4]
          stdoutMatches: ["(?i)definitely-not-a-component"]
          filesAbsent: ["src/components/ui/definitely-not-a-component"]

  - id: core.eject-on-copy-refuses
    title: "eject on a copy project explains there is nothing to eject"
    kind: core
    tags: [os:linux, os:macos, os:windows, kind:marko-run, speed:fast]
    requires:
      {
