  - id: env.symlinked-project
    title: "a project reached through a symlink writes into the real directory"
    kind: environment
    tags: [os:linux, os:macos, kind:paths, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
      post:
        - label: "a sibling symlink to the app, made at the WORKSPACE ROOT"
          cwd: "."
          run: { cmd: "ln -s app link-to-app" }
    speed: medium
    ci: { shard: env }
    covers: ["symlinked project"]
    notes: >
      The symlink target is `app`, and the link is created at the workspace root
      (cwd is set explicitly to "."), so `link-to-app` and `app` are two names
      for one directory. `ln -s "$PWD"` here would be wrong twice over: a setup
      `run` defaults to the app dir, so "$PWD" is the app and the link would be
      self-referential inside it, and even at the root it would point the link at
      the root, which has no package.json.

      The published CLI's entrypoint guard compares import.meta.url against
      pathToFileURL(argv[1]); the runner must invoke it through the realpath, or
      main() silently never runs (see e2e/acceptance/lib/workspace.ts). The
      symlinked-AGENTS.md half of this axis is the same symlink machinery and is
      left to env.symlinked-project's note in README §Coverage.
    steps:
      - name: init through the symlink
        command: init
        args: ["--yes", "--cwd", "link-to-app"]
        cwd: .
        expect:
          exit: 0
          filesExist: ["app/components.json"]
      - name: add through the symlink
        command: add
        args: ["button", "-y", "--cwd", "link-to-app"]
        cwd: .
        expect:
          exit: 0
          filesExist: ["app/src/components/ui/button/button.marko"]
      - use: agents-sync-and-check
      - use: verify-clean

