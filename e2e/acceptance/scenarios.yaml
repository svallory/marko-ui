  - id: existing.shadcn-components-json
    title: "a React shadcn components.json is recognised, not silently adopted"
    kind: existing-project
    tags: [os:linux, os:macos, kind:react, speed:fast]
    requires: { os: [linux, macos], network: npm, tools: [bun, node] }
    setup:
      fixture: react-vite
      post:
        - write: { path: components.json, body: react-shadcn-components-json }
    speed: fast
    ci: { shard: existing }
    covers: ["an existing React shadcn components.json"]
    notes: >
      Settled by the operator. A React components.json parses against the
      CLI's OWN schema — `style`, `rsc`, `tsx`, `tailwind.*` and
      `aliases.components`/`utils` are all fields marko-ui reads — so every
      command except init currently treats a React project as a configured Marko
      one and happily writes `.marko` files into a React app.

      The guard is a React-shaped-config detection at config-load time, so it
      covers EVERY command that loads the config, not just init: init, add,
      status, doctor, diff and agents sync each exit 1 naming shadcn/ui as the
      React project's own CLI and suggesting `--cwd <app>` for the case where a
      monorepo holds both a React app and a Marko app. The runner SKIPS this
      scenario until the guard lands on fix/cli-guards.
    steps:
      - name: init refuses on a React-shaped config
        command: init
        args: ["--force", "--defaults"]
        expect:
          exit: 1
          stdoutMatches: ["(?i)shadcn/ui"]
          stdoutContains: "--cwd"
      - name: the user's own React config is not rewritten
        command: "@helper"
        helper: count-markers
        args: ["ui.shadcn.com/schema.json", "components.json"]
        expect:
          exit: 0
          stdoutMatches: ["^1$"]
      - name: status refuses too — the guard is not init-only
        command: status
        expect:
          exit: 1
          stdoutMatches: ["(?i)shadcn/ui"]
      - name: doctor refuses too
        command: doctor
        expect:
          exit: [1, 3]
          stdoutMatches: ["(?i)shadcn/ui"]
      - name: diff refuses too
        command: diff
        expect:
          exit: 1
          stdoutMatches: ["(?i)shadcn/ui"]
      - name: agents sync refuses too
        command: agents
        sub: ["sync"]
        expect:
          exit: 1
          stdoutMatches: ["(?i)shadcn/ui"]
          filesAbsent: ["AGENTS.md"]

  - id: existing.dirty-git-tree
    title: "a dirty git tree does not block init, and nothing is committed or stashed"
    kind: existing-project
    tags: [os:linux, os:macos, kind:git, speed:fast]
    requires: { os: [linux, macos], network: both, tools: [bun, node, git] }
    setup:
      fixture: stock-marko-run
      post:
        - run:
            {
              cmd: "git init -q && git add -A && git -c user.email=a@b -c user.name=t commit -qm init",
            }
        - write:
            {
              path: src/routes/+page.marko,
              content: "<!-- locally edited, uncommitted -->\n",
            }
        - run: { cmd: "git add -A" }
    speed: fast
    ci: { shard: existing }
    covers: ["dirty git tree"]
    steps:
      - name: init runs with staged local edits present
        command: init
        args: ["--yes"]
        expect:
          exit: 0
          filesExist: ["components.json"]
          fileContains:
            - path: src/routes/+page.marko
              contains: "locally edited"
      - use: add-button
      - name: the user's edit is still unstaged/uncommitted work, not something init touched
        command: "@shell"
        args: ["git", "status", "--porcelain"]
        expect:
          exit: 0
          stdoutContains: "src/routes/+page.marko"

  - id: existing.no-git
    title: "a project with no git at all initializes and installs skills through the npx fallback"
    kind: existing-project
    tags: [os:linux, os:macos, os:windows, kind:git, speed:medium]
    requires: { os: [linux, macos, windows], network: both, tools: [bun, node] }
    setup:
      scaffold:
        tool: create-marko@latest
        args: ["--name", "app", "--template", "basic", "--no-git", "--yes"]
        dir: app
      pm: bun
      install: true
    speed: medium
    ci: { shard: existing }
    covers: ["git missing", "skills relay with no project repo"]
    notes: >
      The scaffold passes --no-git, because upstream create-marko initializes a
      git repository BY DEFAULT (`--no-git  Skip initializing a git repository` in
      `create-marko --help`). Without the flag this scenario would silently test
      a project that has a repo, and the post-step assertion that it does not
      would either fail or — if it ran at the workspace root — pass vacuously
      while app/.git existed. The premise is now established by the flag, not by
      an assertion that depends on where `run` happens to execute.

      The skills relay clones its source with the `skills` package, which shells
      out to git; with no repo here it must still work, which is what the
      scenario pins.
    steps:
      - use: init-copy-vega-neutral
      - use: add-button
      - use: agents-sync-and-check

