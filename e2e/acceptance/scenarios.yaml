  - id: post.readd-user-edited-component
    title: "re-adding an edited component is refused in a terminal and skipped non-interactively"
    kind: post-setup
    tags: [os:linux, os:macos, kind:overwrite, speed:medium]
    requires: { os: [linux, macos], network: both, tools: [bun, node] }
    setup:
      fixture: stock-marko-run
    speed: medium
    ci: { shard: post }
    covers: ["re-add a user-edited component", "diff", "overwrite prompt"]
    notes: >
      Both answers to the same prompt are asserted in one scenario: a terminal
      asks (and this scenario answers No), a non-interactive run keeps the file
      and reports it. `--overwrite` is the third answer and is asserted
      separately in post.readd-with-overwrite.
    steps:
      - use: init-copy-vega-neutral
      - use: add-button
      - name: the user edits the component the CLI installed
        command: "@shell"
        args:
          [
            "sh",
            "-c",
            "printf '// my local tweak\\n' >> src/components/ui/button/button.marko",
          ]
        expect:
          exit: 0
      - name: diff reports the drift
        command: diff
        args: ["button"]
        expect:
          exit: 0
          stdoutContains: "button.marko"
      - name: a terminal re-add asks, and answering No keeps the edit
        command: add
        args: ["button"]
        stdin: pty
        pty:
          - expect: "overwrite"
            send: "n\r"
        expect:
          exit: 0
          fileContains:
            - path: src/components/ui/button/button.marko
              contains: "my local tweak"
      - name: non-interactively it is skipped, not clobbered and not hung
        command: add
        args: ["button", "-y"]
        expect:
          exit: 0
          stdoutMatches: ["(?i)skipped"]
          fileContains:
            - path: src/components/ui/button/button.marko
              contains: "my local tweak"
      - use: verify-clean

