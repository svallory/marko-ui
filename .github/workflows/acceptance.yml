# Acceptance suite (e2e/acceptance) — exercises the PUBLISHED marko-ui/
# @marko-ui/shadcn packages and the live registry deploy, not the workspace.
# Deliberately NOT part of ci.yml: it depends on external services (npm,
# the deployed registry) that are outside this repo's control, so a
# failure here means "something published/deployed is broken," not "this PR
# broke something" — it shouldn't block or flake every PR's required checks.
name: Acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Published package version (npm dist-tag or semver). Empty =
          ACCEPTANCE_PKG_VERSION repo variable, else `latest`.
        required: false
        default: ""
        type: string
      registry_url:
        description: >-
          Registry base URL. Empty = ACCEPTANCE_REGISTRY_URL repo
          variable, else the live registry.
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "e2e/acceptance/**"
      - ".github/workflows/acceptance.yml"
  schedule:
    # Weekly, well off :00/:30 to avoid the fleet-wide top-of-hour thundering
    # herd. Catches a stale registry deploy or a broken publish within a
    # week even with nobody watching.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  acceptance:
    name: Published-package acceptance suite
    runs-on: ubuntu-latest
    # Headroom, deliberately generous. The registry build is IN-SUITE — the
    # mirror builds what it serves, on a cold checkout, before any scenario
    # starts — and its own timeout is 30 minutes; a 77-scenario matrix on cold
    # package-manager caches is hours, not minutes (README §Timing: ~4 h
    # single-threaded at a ~3-min median). This job is scheduled/weekly and does
    # not block a PR, so a high ceiling costs nothing while a low one kills a
    # run that was making progress. When the matrix is sharded (a later
    # change), each shard's budget can come down to its own measured worst case
    # plus that 30-minute build.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: ./.github/actions/setup
      - name: Run acceptance suite against live registry + npm
        run: bun run test:acceptance
        env:
          # Dispatch inputs win when set; otherwise fall back to the repo
          # variables so scheduled/PR runs are unchanged (empty string =>
          # e2e/acceptance/lib/env.ts falls back to its own default).
          ACCEPTANCE_REGISTRY_URL: ${{ inputs.registry_url||vars.ACCEPTANCE_REGISTRY_URL }}
          ACCEPTANCE_PKG_VERSION: ${{ inputs.version||vars.ACCEPTANCE_PKG_VERSION }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: acceptance-results
          path: e2e/acceptance/results.json
          if-no-files-found: ignore
