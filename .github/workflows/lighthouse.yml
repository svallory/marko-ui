# Lighthouse CI over the production docs build. Produces the
# lighthouse-accessibility / performance / best-practices / seo endpoint
# badges (minimum score across the audited pages) on the `badges` branch.
name: Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and serve docs
        run: bash scripts/ci/serve-docs.sh
      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/docs/components/accordion
            http://localhost:3000/docs/components/dialog
            http://localhost:3000/docs/components/select
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Generate badges
        run: bun scripts/ci/badge.ts lighthouse "${{ steps.lhci.outputs.resultsPath }}/manifest.json" badge-out
      - name: Push to badges branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-badges.sh badge-out
