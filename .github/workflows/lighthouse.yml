# Lighthouse accessibility over the production docs build's component pages,
# plus bare component pages for 100/100/100/100 performance/a11y/best-practices/seo assertions.
# The bare pages are the components' true metrics; docs-site scores are noise to
# library users. The badge reports the MINIMUM across pages.
name: Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and serve docs
        run: bash scripts/ci/serve-docs.sh
      - name: Lighthouse a11y on component docs pages
        id: lhci_a11y
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            http://localhost:3000/docs/components/accordion
            http://localhost:3000/docs/components/carousel
            http://localhost:3000/docs/components/dialog
            http://localhost:3000/docs/components/field
            http://localhost:3000/docs/components/select
            http://localhost:3000/docs/components/slider
            http://localhost:3000/docs/components/table
            http://localhost:3000/docs/components/tree-view
          configPath: .github/lighthouse/lighthouserc-a11y.json
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-results-a11y
          temporaryPublicStorage: true
      - name: Lighthouse 100 on bare component pages (Desktop)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/bare/accordion
            http://localhost:3000/bare/button
            http://localhost:3000/bare/carousel
            http://localhost:3000/bare/color-picker
            http://localhost:3000/bare/combobox
            http://localhost:3000/bare/data-table
            http://localhost:3000/bare/date-picker
            http://localhost:3000/bare/dialog
            http://localhost:3000/bare/select
            http://localhost:3000/bare/slider
            http://localhost:3000/bare/tabs
            http://localhost:3000/bare/tooltip
          configPath: .github/lighthouse/lighthouserc-bare-desktop.json
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-results-bare-desktop
          temporaryPublicStorage: true
      - name: Lighthouse 100 on bare component pages (Mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/bare/accordion
            http://localhost:3000/bare/button
            http://localhost:3000/bare/carousel
            http://localhost:3000/bare/color-picker
            http://localhost:3000/bare/combobox
            http://localhost:3000/bare/data-table
            http://localhost:3000/bare/date-picker
            http://localhost:3000/bare/dialog
            http://localhost:3000/bare/select
            http://localhost:3000/bare/slider
            http://localhost:3000/bare/tabs
            http://localhost:3000/bare/tooltip
          configPath: .github/lighthouse/lighthouserc-bare-mobile.json
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-results-bare-mobile
          temporaryPublicStorage: true
      - name: Generate badges
        run: bun scripts/ci/badge.ts lighthouse-a11y "${{ steps.lhci_a11y.outputs.resultsPath }}/manifest.json" badge-out
      - name: Push to badges branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-badges.sh badge-out
