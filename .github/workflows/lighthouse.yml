# Lighthouse CI over the production docs build. Two audit targets:
# - accessibility on the bare component verify pages (the components ARE the
#   claim) → lighthouse-accessibility badge
# - best-practices + seo on the real docs pages → their badges
# No performance badge: perf is a whole-page metric — meaningless on bare
# component fixtures, and the docs pages' number belongs to the site, not the
# library. Badges report the MINIMUM across audited pages.
name: Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and serve docs
        run: bash scripts/ci/serve-docs.sh
      - name: Lighthouse a11y on component verify pages
        id: lhci_a11y
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/verify/default/accordion
            http://localhost:3000/verify/default/carousel
            http://localhost:3000/verify/default/dialog
            http://localhost:3000/verify/default/field
            http://localhost:3000/verify/default/select
            http://localhost:3000/verify/default/slider
            http://localhost:3000/verify/default/table
            http://localhost:3000/verify/default/tree-view
          configPath: .github/lighthouse/lighthouserc-a11y.json
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-results-components
          temporaryPublicStorage: true
      - name: Lighthouse best-practices/seo on docs pages
        id: lhci_site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/docs/components/accordion
            http://localhost:3000/docs/components/dialog
          configPath: .github/lighthouse/lighthouserc-site.json
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-results-site
          temporaryPublicStorage: true
      - name: Generate badges
        run: |
          bun scripts/ci/badge.ts lighthouse-a11y "${{ steps.lhci_a11y.outputs.resultsPath }}/manifest.json" badge-out
          bun scripts/ci/badge.ts lighthouse-site "${{ steps.lhci_site.outputs.resultsPath }}/manifest.json" badge-out
      - name: Push to badges branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-badges.sh badge-out
