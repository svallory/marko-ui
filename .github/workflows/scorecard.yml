# OpenSSF Scorecard supply-chain security analysis. publish_results makes the
# score available as a badge:
#   https://api.scorecard.dev/projects/github.com/svallory/marko-ui/badge
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@365df9f035d4b5177b9cd57330f8c3dfa6134420 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@3db7caf9014b962f9392088c0fcaf53eeddf47db # v3
        with:
          sarif_file: results.sarif
