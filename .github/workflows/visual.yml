# Gallery + docs chrome visual-regression guard.
#
# Runs every spec in Playwright's `visual` project (playwright.config.ts):
# gallery-visual.spec.ts renders the component gallery in every visual style
# the registry ships (8: rhea, nova, vega, lyra, maia, mira, luma, sera) ×
# light/dark × the three /create/preview showcase pages = 48 full-page
# screenshots; chrome-visual.spec.ts covers the docs site chrome and the
# new-york style on the surfaces it actually ships on (12 screenshots). Both
# fail on any pixel change. This workflow's steps below are generalized over
# every visual-project spec's own `e2e/*.spec.ts-snapshots/linux` dir rather
# than hardcoding gallery-visual.spec.ts's — see each step's own comment for
# why a hardcoded path here is a real bug, not just untidy. See each spec
# file for how its gallery/pages are assembled and AGENTS.md "Gallery visual
# guard" for the workflow around them.
#
# Deliberately a separate file from ci.yml: baselines are PNGs that only
# ever match when generated on the same OS that compares them, so this
# workflow owns both halves — the `visual` job compares, and the
# `update-baselines` job regenerates and commits them back to the PR branch.
name: Visual

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate baselines and commit them to the branch"
        type: boolean
        default: false

# The compare and update paths get SEPARATE concurrency groups on purpose.
# They share a ref, and the updater pushes a baseline commit to that ref —
# which starts a compare run. Under one shared group with
# cancel-in-progress, that new compare run would cancel the updater that
# spawned it, killing any step still to come after the push. Splitting the
# group means a compare run can never cancel an update run (and vice versa),
# while redundant runs of the *same* kind on the same ref still collapse.
concurrency:
  group: visual-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.update_baselines) && 'update' || 'compare' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Compare against the committed baselines. This is the actual guard.
  visual:
    name: Gallery screenshots
    # Skipped when this run was dispatched to regenerate baselines — the
    # update job below does the capturing in that case, and comparing
    # against baselines that are about to be replaced is noise.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup

      # Every step below that needs "which spec files does the `visual`
      # project run" reads this list rather than re-deriving it with its own
      # heuristic. A previous version had each step independently grep
      # playwright.config.ts's testMatch array for a literal quoted
      # filename — that breaks silently (a real visual spec treated as
      # needing no baselines, in every step, with no error) the moment
      # testMatch becomes a RegExp or uses single quotes, since neither
      # matches the grep pattern. Asking Playwright itself for its own
      # resolved test list has no such blind spot: it reflects whatever
      # testMatch/testIgnore/project config actually resolves to, however
      # it's spelled. `--list` needs no server (pure static discovery; ran
      # locally against port with nothing listening) but does need
      # dependencies installed, hence placed right after `setup`. Fails the
      # step (not just prints a warning) if the list command errors or
      # resolves to zero specs — either means the whole guard would be
      # silently guarding nothing downstream.
      - name: List visual specs
        run: |
          set -euo pipefail
          bunx playwright test --project=visual --list --reporter=json \
            | jq -r '[.. | .file? // empty] | unique | .[]' \
            > "$RUNNER_TEMP/visual-specs.txt"
          if [ ! -s "$RUNNER_TEMP/visual-specs.txt" ]; then
            echo "::error::playwright --list resolved zero specs for the visual project."
            exit 1
          fi
          echo "visual project specs:"
          cat "$RUNNER_TEMP/visual-specs.txt"

      - name: Build and serve docs
        run: bash scripts/ci/serve-docs.sh

      # Fails loudly rather than silently passing a PR that has no baselines
      # at all (a first run on a new branch, or a bad merge that dropped
      # them). Playwright itself would WRITE the missing baselines and exit
      # 0, which would make the guard look green while guarding nothing.
      #
      # Generalized over every spec file "List visual specs" (above)
      # resolved rather than hardcoding one file's snapshot dir — a
      # hardcoded path here would let a NEW visual spec with no baselines
      # pass green while guarding nothing, exactly the failure mode this
      # check exists to catch. Fails closed: ANY spec's linux baseline dir
      # being empty/missing fails the whole check.
      - name: Check baselines exist
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r name; do
            dir="e2e/${name}-snapshots/linux"
            # `find`, not `ls` (SC2012): counts only real .png baselines, so a
            # stray non-PNG in the directory can't make an empty baseline set
            # look populated.
            count=$(find "$dir" -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
            if [ "$count" -eq 0 ]; then
              echo "::error::No linux baselines in $dir."
              echo "::error::Generate them on the runner: Actions > Visual > Run workflow > update baselines = true."
              fail=1
            else
              echo "$dir: $count baseline(s) present"
            fi
          done < "$RUNNER_TEMP/visual-specs.txt"
          exit $fail

      - name: Run gallery visual guard
        env:
          DOCS_BASE_URL: http://localhost:3000
        run: bun run test:visual

      # The diff/actual/expected triplet Playwright writes per failure — the
      # only way to judge whether a red run is a real regression or an
      # intended restyle.
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # Regenerate baselines ON THE RUNNER and commit them back. This is the
  # ONLY supported way to update them: a local `--update-snapshots` records
  # macOS font rasterisation, which can never match a Linux run.
  #
  # Trigger: Actions > Visual > Run workflow, with "update baselines" checked
  # and the PR's branch selected.
  update-baselines:
    name: Regenerate baselines
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
      - uses: ./.github/actions/setup

      # Same derivation and same rationale as the `visual` job's own "List
      # visual specs" step above — see its comment for why a
      # grep-testMatch-for-a-literal-filename heuristic is a silent blind
      # spot and asking Playwright itself is not.
      - name: List visual specs
        run: |
          set -euo pipefail
          bunx playwright test --project=visual --list --reporter=json \
            | jq -r '[.. | .file? // empty] | unique | .[]' \
            > "$RUNNER_TEMP/visual-specs.txt"
          if [ ! -s "$RUNNER_TEMP/visual-specs.txt" ]; then
            echo "::error::playwright --list resolved zero specs for the visual project."
            exit 1
          fi
          echo "visual project specs:"
          cat "$RUNNER_TEMP/visual-specs.txt"

      - name: Build and serve docs
        run: bash scripts/ci/serve-docs.sh

      # Deleted first so a baseline whose test no longer exists does not
      # survive forever as an orphan. Generalized over every visual spec's
      # snapshot dir (not just gallery-visual.spec.ts's) — see "List visual
      # specs" above for the derivation and the "Check baselines exist" step
      # in the `visual` job for why a hardcoded/grepped single-file path
      # here is the same class of bug.
      - name: Regenerate
        env:
          DOCS_BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            rm -rf "e2e/${name}-snapshots/linux"
          done < "$RUNNER_TEMP/visual-specs.txt"
          bun run test:visual:update

      # Lossless only. `-o 4 --strip safe` re-encodes the pixel data more
      # compactly and drops non-essential metadata chunks; it never alters a
      # pixel. Measured on the runner's 48-shot set (the `du -sk` figures this
      # step prints): 11644KB -> 8600KB, a 26% reduction, with every file
      # byte-different but all 48 decoded-pixel-identical and the comparison
      # re-run below still 49/49 green — Playwright compares decoded pixels,
      # not file bytes.
      #
      # The committed baselines are 8.7 MB (8,687,819 bytes across 48 files).
      # Quote that one figure and no other; AGENTS.md repeats it, and earlier
      # drafts of this PR cited three different numbers because some were MiB,
      # some MB, and some pre-optimization.
      #
      # The binary comes from oxipng's own GitHub release, pinned to an exact
      # version AND verified against a recorded SHA-256 before it is allowed
      # to run — this job holds `contents: write`, so an unverified download
      # is not acceptable. Two routes were tried and rejected: the `oxipng`
      # npm package is an unofficial third-party repackage (mvasilkov/oxipng,
      # stuck at 1.0.1, last published >1y ago), and apt has no `oxipng` on
      # the ubuntu-24.04 runner at all ("E: Unable to locate package").
      # NEVER swap in pngquant or any other lossy optimizer: it would alter
      # pixels and silently rewrite what the guard asserts.
      - name: Optimize baselines (lossless)
        env:
          OXIPNG_VERSION: 10.2.1
          OXIPNG_SHA256: 1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17
        run: |
          set -euo pipefail
          tarball="oxipng-${OXIPNG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/oxipng/oxipng/releases/download/v${OXIPNG_VERSION}/${tarball}"
          echo "${OXIPNG_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball"
          oxipng="$PWD/oxipng-${OXIPNG_VERSION}-x86_64-unknown-linux-musl/oxipng"
          "$oxipng" --version

          while IFS= read -r name; do
            dir="e2e/${name}-snapshots/linux"
            if [ ! -d "$dir" ]; then
              continue
            fi
            before=$(du -sk "$dir" | cut -f1)
            "$oxipng" -o 4 --strip safe -q "$dir"/*.png
            after=$(du -sk "$dir" | cut -f1)
            echo "$dir: ${before}KB -> ${after}KB"
          done < "$RUNNER_TEMP/visual-specs.txt"

          rm -rf "$tarball" "oxipng-${OXIPNG_VERSION}-x86_64-unknown-linux-musl"

      # Optimizing must not have changed what the baselines assert. This
      # re-runs the comparison against the just-optimized files; a failure
      # here means the optimizer was not lossless and the commit is aborted.
      - name: Verify optimized baselines still compare equal
        env:
          DOCS_BASE_URL: http://localhost:3000
        run: bun run test:visual

      # BRANCH goes through env, not `${{ }}` inside run: — a branch name is
      # attacker-controllable text and would otherwise be interpolated
      # straight into the shell.
      - name: Commit baselines
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r name; do
            git add -A "e2e/${name}-snapshots"
          done < "$RUNNER_TEMP/visual-specs.txt"
          if git diff --cached --quiet; then
            echo "baselines unchanged"
            exit 0
          fi
          git commit -m "test(visual): regenerate gallery baselines on CI runner"
          git push origin "HEAD:refs/heads/$BRANCH"
