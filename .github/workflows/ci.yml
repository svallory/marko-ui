# CI + badge data. Every job runs its suite against the real production
# build (scripts/ci/serve-docs.sh) and emits shields.io endpoint JSON; the
# publish job pushes those to the `badges-main` branch on main (main's
# numbers — the README reads them). The site home reads the `badges`
# branch, which is NOT written here: it is release-pinned, rewritten by
# release.yml from the release tag after each publish. Render with:
#   https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/svallory/marko-ui/badges-main/<name>.json
# Badge files: checks.json + checks-count.json (combine of tests.json),
# tests.json, hydration.json, axe.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters apply to `pull_request` runs ONLY. A `push` to `main` (and
  # workflow_dispatch) must never be filtered — every job always runs there
  # unconditionally, so main's badges/status stay trustworthy regardless of
  # which paths a merge touched. Every downstream job's `if:` therefore reads
  # `github.event_name != 'pull_request' || needs.changes.outputs.<x> == 'true'`
  # rather than gating on the filter output alone.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always run so its outputs exist for the `if:` checks below, even
    # though only pull_request runs actually consult them.
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      docs: ${{ steps.filter.outputs.docs }}
      registry: ${{ steps.filter.outputs.registry }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      # Root-level config files considered for these filters, and why each
      # was included or excluded (re-derive this list, don't trust it blindly,
      # whenever a job's commands or their config surface changes):
      #   - vitest.config.ts (root) — decides `tests`' include/exclude and the
      #     marko plugin config for `bunx vitest run`; added to `docs`.
      #   - tsconfig.json (root) — extended by apps/docs/tsconfig.json,
      #     tooling/tsconfig.json, and packages/shadcn/tsconfig.json (verified
      #     via each file's `extends`); added to `docs` (apps/docs, tooling)
      #     and `registry` (tooling). NOT added to `cli`:
      #     packages/marko-ui/tsconfig.json does not extend it (standalone
      #     compilerOptions) and cli-tests never runs a typecheck anyway
      #     (`bun run --filter marko-ui test` is vitest-only). Kept in
      #     `registry` only through `tooling`'s extends — packages/shadcn's
      #     extends is irrelevant to `registry-drift`, which never
      #     typechecks, but the file is already covered by `tooling`'s path
      #     below so no separate entry is needed for that reason.
      #   - biome.json / .eslintrc* / prettier config — none exist in this
      #     repo (checked: no biome.json, no .eslintrc*, no committed
      #     prettier.config; `prettier` is a devDependency with no CI script
      #     invoking it). Nothing to add.
      #   - playwright.config.ts — exists (repo root, testDir "e2e"), but no
      #     job in this workflow runs `playwright test`; not added. If a
      #     playwright job is ever added here, gate it on `docs` and add
      #     playwright.config.ts + e2e/** to that filter.
      #   - e2e/** — only consumed by `test:acceptance`
      #     (e2e/acceptance/vitest.config.ts), which is its own workflow
      #     (acceptance.yml) and not part of ci.yml. Not added.
      #   - tooling/** — already listed explicitly in `docs` and `registry`
      #     (the registry/style build scripts themselves); `cli` doesn't run
      #     any tooling script, so it's correctly absent there.
      # Pinned to the v4.0.3 tag's commit SHA (not a tag ref) per repo policy
      # on third-party actions.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            cli:
              - 'packages/marko-ui/**'
              - 'bun.lock'
              - 'package.json'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            docs:
              - 'packages/shadcn/**'
              - 'apps/docs/**'
              - 'packages/marko-ui/**'
              - 'tooling/**'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'bun.lock'
              - 'package.json'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            packages:
              - 'packages/**'
              - 'bun.lock'
              - 'package.json'
              - 'tooling/check-pkg.ts'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            registry:
              - 'packages/shadcn/**'
              - 'packages/marko-ui/src/registry/**'
              - 'apps/docs/src/data/directory.json'
              # Demo sources feed build:demos (demos-manifest.ts, the
              # per-component static routes under src/routes/docs/components/,
              # and the renderer tags under src/tags/docs/demo-renderers/)
              # and blocks-list.ts feeds
              # build:blocks-manifest — both gated by registry-drift, so a
              # change there must fire this job or the freshness gate never
              # runs on the PR that makes it stale.
              - 'apps/docs/src/demos/**'
              - 'apps/docs/src/lib/blocks-list.ts'
              - 'tooling/**'
              - 'tsconfig.json'
              - 'bun.lock'
              - 'package.json'
              # scripts/ci/** deliberately NOT included here: registry-drift
              # only runs `bun run build:registry` + `git diff`, neither of
              # which touches scripts/ci/** (that dir feeds serve-docs.sh,
              # axe-scan.ts, badge.ts — none used by this job). Unlike `cli`
              # and `docs`, which both invoke scripts under scripts/ci/**
              # directly, this job has no path to that directory at all.
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'

  cli-tests:
    name: CLI unit tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: ./.github/actions/setup
      # packages/marko-ui is excluded from the root vitest config (it needs its
      # own @/ path alias + msw setup, see packages/marko-ui/vitest.config.ts),
      # so it must be run through its own config or it never executes in CI.
      - name: Run marko-ui CLI suite
        run: bun run --filter marko-ui test

      # Scaffolds a real `create-marko` app and drives init/add/build through
      # it, asserting the BUILD OUTPUT (theme tokens + component utilities in
      # the emitted CSS). The unit suite above cannot catch this class: it
      # never runs the CLI against a real project, so a first-run defect that
      # leaves the user with an unstyled page passes it cleanly.
      #
      # Builds and serves the registry itself rather than reusing the `tests`
      # job's serve-docs.sh, because that job is gated on the `docs` path
      # filter while this one is gated on `cli` — a CLI-only change must still
      # run this.
      - name: Run CLI first-run e2e
        run: bun run test:cli:e2e

  registry-drift:
    name: Registry drift check
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: ./.github/actions/setup
      # Rebuilds the registry and every committed generated artifact, then
      # fails if any checked-in proxy of that output drifted. What each step
      # does and does not guarantee, exactly:
      #   - registry-manifest.json (emitted by build-registry.ts, COMMITTED):
      #     sha256 of every apps/docs/public/r/** output file, sorted, with
      #     REGISTRY_BASE_URL occurrences replaced by a placeholder before
      #     hashing — so the base URL used at build time can never change the
      #     manifest, and a diff means packages/shadcn/**, packages/marko-ui/
      #     src/registry/**, directory.json, or tooling/** altered the
      #     registry output without regenerating the manifest. The r/ output
      #     itself stays gitignored (it embeds REGISTRY_BASE_URL for deploys);
      #     the manifest is the checked-in proxy that makes output drift
      #     detectable — the old `git diff --exit-code -- apps/docs/public/r/`
      #     could never fail because gitignore hides that tree (issue #40).
      #   - demos-manifest.ts + the per-component static routes and renderer
      #     tags (build:demos): fresh against the registry output AND
      #     src/demos/**. The route/renderer trees are checked with BOTH
      #     git diff (tracked files changed) and git status --porcelain
      #     (generated files newly untracked or deleted) — plain git diff
      #     alone misses untracked outputs, so a stale generated stub would
      #     otherwise slip through.
      #   - blocks-manifest.ts (build:blocks-manifest): fresh against the
      #     registry output AND src/lib/blocks-list.ts.
      #   - api-reference.json (extract:api): fresh against the .marko
      #     sources under packages/shadcn/ui/**.
      # All four generators were verified deterministic (two consecutive runs
      # produce byte-identical output on an untouched tree), so `git diff
      # --exit-code` cannot flake on generator nondeterminism.
      - name: Build registry and check manifest for drift
        run: |
          bun run build:registry
          git diff --exit-code -- apps/docs/registry-manifest.json || {
            echo "::error file=apps/docs/registry-manifest.json::Registry output drifted from the committed manifest — run 'bun run build:registry' and commit the regenerated apps/docs/registry-manifest.json"
            exit 1
          }
      - name: Check generated committed artifacts are fresh
        run: |
          bun run build:demos
          git diff --exit-code -- apps/docs/src/demos/demos-manifest.ts || {
            echo "::error::Generated demos manifest is stale — run 'bun run build:demos' and commit the regenerated apps/docs/src/demos/demos-manifest.ts"
            exit 1
          }
          # The static routes and renderer tags are whole generated trees:
          # git diff catches edits to tracked files, git status --porcelain
          # catches newly-untracked stale outputs (plain git diff misses
          # untracked files). The hand-maintained '$name' fallback lives in
          # the same directory and is never generated, so it can only show up
          # here if a change actually touched it — which SHOULD fail the gate.
          GENERATED_DEMO_TREES="apps/docs/src/routes/docs/components apps/docs/src/tags/docs/demo-renderers"
          git diff --exit-code -- $GENERATED_DEMO_TREES || {
            echo "::error::Generated component routes/renderers are stale — run 'bun run build:demos' and commit the regenerated apps/docs/src/routes/docs/components/<name>/ and apps/docs/src/tags/docs/demo-renderers/<name>.marko"
            exit 1
          }
          test -z "$(git status --porcelain -- $GENERATED_DEMO_TREES)" || {
            echo "::error::Generated component routes/renderers have untracked or deleted files — run 'bun run build:demos' and commit the result"
            git status --porcelain -- $GENERATED_DEMO_TREES
            exit 1
          }
          bun run build:blocks-manifest
          git diff --exit-code -- apps/docs/src/lib/blocks-manifest.ts || {
            echo "::error::Generated blocks manifest is stale — run 'bun run build:blocks-manifest' and commit the regenerated apps/docs/src/lib/blocks-manifest.ts"
            exit 1
          }
          bun run extract:api
          git diff --exit-code -- apps/docs/src/lib/api-reference.json || {
            echo "::error::Generated API reference is stale — run 'bun run extract:api' and commit the regenerated apps/docs/src/lib/api-reference.json"
            exit 1
          }

  pkg-checks:
    name: Package integrity (publint + attw)
    # The `packages` path-filter output exists for this job — it was added
    # with the filter but had no consumer until now. Gated like the others:
    # never filtered on push to main / workflow_dispatch.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: ./.github/actions/setup
      # Publint + attw over the packed tarballs (ESM-only correctness).
      # Same gate release.yml runs before publishing — a PR that breaks
      # publish shape must fail here, not at release time.
      - name: Run package checks
        run: bun run check:pkg

  tests:
    name: Behavior & hydration tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: ./.github/actions/setup
      - name: Build and serve docs
        run: bash scripts/ci/serve-docs.sh
      - name: Run vitest suites
        env:
          DOCS_BASE_URL: http://localhost:3000
        run: bunx vitest run --reporter=default --reporter=json --outputFile.json=vitest-results.json
      - name: Validate HTML
        run: bun run check:html
      - name: Generate badges
        if: always()
        run: bun scripts/ci/badge.ts vitest vitest-results.json badge-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always()
        with:
          name: badges-tests
          path: badge-out/

  axe:
    name: axe-core WCAG scan
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: ./.github/actions/setup
      - name: Build and serve docs
        run: bash scripts/ci/serve-docs.sh
      - name: Run axe scan
        env:
          DOCS_BASE_URL: http://localhost:3000
        run: bun scripts/ci/axe-scan.ts axe-results.json
      - name: Generate badges
        if: always()
        run: bun scripts/ci/badge.ts axe axe-results.json badge-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always()
        with:
          name: badges-axe
          path: badge-out/

  publish-badges:
    name: Publish badges
    needs: [tests, axe]
    # Only fires on push to main, where the `changes` filters are never
    # consulted (see the note above) — tests/axe always ran, so this needs
    # no additional gating.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v4
        with:
          pattern: badges-*
          path: badges
          merge-multiple: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Combine test badges into checks.json
        run: bun scripts/ci/badge.ts combine badges badges
      - name: Push to badges-main branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-badges.sh badges badges-main

  # Aggregate gate. Branch protection has no required checks configured
  # today (verified via `gh api repos/svallory/marko-ui/branches/main/protection`
  # -> 404 "Branch not protected"), so nothing currently depends on this job
  # existing. It's added anyway, cheaply, as the one stable name a future
  # required-check rule should point at: cli-tests/registry-drift/tests/axe
  # can each report "skipped" on a PR that doesn't touch their paths, and a
  # required check stuck on "skipped" forever is indistinguishable from one
  # that's still queued in GitHub's UI — `ci-ok` always runs (`if: always()`)
  # and gives one green/red signal that treats a legitimate skip as fine but
  # still fails on a real failure or cancellation.
  #
  # `changes` is included here too, and treated as a required result (not a
  # legitimate-skip candidate): it has no `if:` gating it, so anything other
  # than `success` means the filter computation itself failed (bad checkout,
  # action download failure, malformed filter syntax) — every other job's
  # `if:` would then evaluate its `needs.changes.outputs.*` as empty/false
  # and report `skipped`, which this job's loop treats as fine. Without
  # `changes` in the loop, a broken `changes` job would produce an all-green
  # `ci-ok` on a pipeline that never actually ran anything — a false green.
  ci-ok:
    name: CI ok
    needs: [changes, cli-tests, registry-drift, pkg-checks, tests, axe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required job results
        # Job results are passed through env, not interpolated with ${{ }}
        # directly into the shell script body, to avoid the injection-prone
        # pattern of substituting untrusted/expression values into a shell
        # string before the shell ever sees them. `needs.*.result` values
        # are controlled by GitHub Actions itself (one of a fixed enum:
        # success/failure/cancelled/skipped), not attacker-controlled, but
        # this keeps the pattern consistent and avoids the anti-pattern.
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLI_TESTS_RESULT: ${{ needs.cli-tests.result }}
          REGISTRY_DRIFT_RESULT: ${{ needs.registry-drift.result }}
          PKG_CHECKS_RESULT: ${{ needs.pkg-checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          AXE_RESULT: ${{ needs.axe.result }}
        run: |
          for r in "$CHANGES_RESULT" "$CLI_TESTS_RESULT" "$REGISTRY_DRIFT_RESULT" "$PKG_CHECKS_RESULT" "$TESTS_RESULT" "$AXE_RESULT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required job did not pass (result: $r)" >&2
              exit 1
            fi
          done
          echo "all required jobs passed or were legitimately skipped"
