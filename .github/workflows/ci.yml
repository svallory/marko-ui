# CI + badge data. Every job runs its suite against the real production
# build (scripts/ci/serve-docs.sh) and emits shields.io endpoint JSON; the
# publish job pushes those to the `badges` branch on main. Render with:
#   https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/svallory/marko-ui/badges/<name>.json
# Badge files: tests.json, hydration.json, axe.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters apply to `pull_request` runs ONLY. A `push` to `main` (and
  # workflow_dispatch) must never be filtered — every job always runs there
  # unconditionally, so main's badges/status stay trustworthy regardless of
  # which paths a merge touched. Every downstream job's `if:` therefore reads
  # `github.event_name != 'pull_request' || needs.changes.outputs.<x> == 'true'`
  # rather than gating on the filter output alone.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always run so its outputs exist for the `if:` checks below, even
    # though only pull_request runs actually consult them.
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      docs: ${{ steps.filter.outputs.docs }}
      registry: ${{ steps.filter.outputs.registry }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      # Root-level config files considered for these filters, and why each
      # was included or excluded (re-derive this list, don't trust it blindly,
      # whenever a job's commands or their config surface changes):
      #   - vitest.config.ts (root) — decides `tests`' include/exclude and the
      #     marko plugin config for `bunx vitest run`; added to `docs`.
      #   - tsconfig.json (root) — extended by apps/docs/tsconfig.json,
      #     tooling/tsconfig.json, and packages/shadcn/tsconfig.json (verified
      #     via each file's `extends`); added to `docs` (apps/docs, tooling)
      #     and `registry` (tooling). NOT added to `cli`:
      #     packages/marko-ui/tsconfig.json does not extend it (standalone
      #     compilerOptions) and cli-tests never runs a typecheck anyway
      #     (`bun run --filter marko-ui test` is vitest-only). Kept in
      #     `registry` only through `tooling`'s extends — packages/shadcn's
      #     extends is irrelevant to `registry-drift`, which never
      #     typechecks, but the file is already covered by `tooling`'s path
      #     below so no separate entry is needed for that reason.
      #   - biome.json / .eslintrc* / prettier config — none exist in this
      #     repo (checked: no biome.json, no .eslintrc*, no committed
      #     prettier.config; `prettier` is a devDependency with no CI script
      #     invoking it). Nothing to add.
      #   - playwright.config.ts — exists (repo root, testDir "e2e"), but no
      #     job in this workflow runs `playwright test`; not added. If a
      #     playwright job is ever added here, gate it on `docs` and add
      #     playwright.config.ts + e2e/** to that filter.
      #   - e2e/** — only consumed by `test:acceptance`
      #     (e2e/acceptance/vitest.config.ts), which is its own workflow
      #     (acceptance.yml) and not part of ci.yml. Not added.
      #   - tooling/** — already listed explicitly in `docs` and `registry`
      #     (the registry/style build scripts themselves); `cli` doesn't run
      #     any tooling script, so it's correctly absent there.
      # Pinned to the v4.0.3 tag's commit SHA (not a tag ref) per repo policy
      # on third-party actions.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            cli:
              - 'packages/marko-ui/**'
              - 'bun.lock'
              - 'package.json'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            docs:
              - 'packages/shadcn/**'
              - 'apps/docs/**'
              - 'packages/marko-ui/**'
              - 'tooling/**'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'bun.lock'
              - 'package.json'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            packages:
              - 'packages/**'
              - 'bun.lock'
              - 'package.json'
              - 'tooling/check-pkg.ts'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            registry:
              - 'packages/shadcn/**'
              - 'packages/marko-ui/src/registry/**'
              - 'apps/docs/src/data/directory.json'
              - 'tooling/**'
              - 'tsconfig.json'
              - 'bun.lock'
              - 'package.json'
              # scripts/ci/** deliberately NOT included here: registry-drift
              # only runs `bun run build:registry` + `git diff`, neither of
              # which touches scripts/ci/** (that dir feeds serve-docs.sh,
              # axe-scan.ts, badge.ts — none used by this job). Unlike `cli`
              # and `docs`, which both invoke scripts under scripts/ci/**
              # directly, this job has no path to that directory at all.
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'

  cli-tests:
    name: CLI unit tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: ./.github/actions/setup
      # packages/marko-ui is excluded from the root vitest config (it needs its
      # own @/ path alias + msw setup, see packages/marko-ui/vitest.config.ts),
      # so it must be run through its own config or it never executes in CI.
      - name: Run marko-ui CLI suite
        run: bun run --filter marko-ui test

      # Scaffolds a real `create-marko` app and drives init/add/build through
      # it, asserting the BUILD OUTPUT (theme tokens + component utilities in
      # the emitted CSS). The unit suite above cannot catch this class: it
      # never runs the CLI against a real project, so a first-run defect that
      # leaves the user with an unstyled page passes it cleanly.
      #
      # Builds and serves the registry itself rather than reusing the `tests`
      # job's serve-docs.sh, because that job is gated on the `docs` path
      # filter while this one is gated on `cli` — a CLI-only change must still
      # run this.
      - name: Run CLI first-run e2e
        run: bun run test:cli:e2e

  registry-drift:
    name: Registry drift check
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: ./.github/actions/setup
      # DEPLOY.md "CI check": keeps the registry output honest before every
      # deploy. apps/docs/public/r/ is gitignored and rebuilt here with the
      # localhost default (no REGISTRY_BASE_URL override), so a clean exit
      # code means packages/shadcn/** and tooling/build-registry.ts still
      # produce the same registry — a non-zero diff means either script
      # changed behavior or the registry build itself failed.
      - name: Build registry and check for drift
        run: bun run build:registry && git diff --exit-code -- apps/docs/public/r/

  tests:
    name: Behavior & hydration tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: ./.github/actions/setup
      - name: Build and serve docs
        run: bash scripts/ci/serve-docs.sh
      - name: Run vitest suites
        env:
          DOCS_BASE_URL: http://localhost:3000
        run: bunx vitest run --reporter=default --reporter=json --outputFile.json=vitest-results.json
      - name: Validate HTML
        run: bun run check:html
      - name: Generate badges
        if: always()
        run: bun scripts/ci/badge.ts vitest vitest-results.json badge-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always()
        with:
          name: badges-tests
          path: badge-out/

  axe:
    name: axe-core WCAG scan
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: ./.github/actions/setup
      - name: Build and serve docs
        run: bash scripts/ci/serve-docs.sh
      - name: Run axe scan
        env:
          DOCS_BASE_URL: http://localhost:3000
        run: bun scripts/ci/axe-scan.ts axe-results.json
      - name: Generate badges
        if: always()
        run: bun scripts/ci/badge.ts axe axe-results.json badge-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always()
        with:
          name: badges-axe
          path: badge-out/

  publish-badges:
    name: Publish badges
    needs: [tests, axe]
    # Only fires on push to main, where the `changes` filters are never
    # consulted (see the note above) — tests/axe always ran, so this needs
    # no additional gating.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v4
        with:
          pattern: badges-*
          path: badges
          merge-multiple: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Combine test badges into checks.json
        run: bun scripts/ci/badge.ts combine badges badges
      - name: Push to badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-badges.sh badges

  # Aggregate gate. Branch protection has no required checks configured
  # today (verified via `gh api repos/svallory/marko-ui/branches/main/protection`
  # -> 404 "Branch not protected"), so nothing currently depends on this job
  # existing. It's added anyway, cheaply, as the one stable name a future
  # required-check rule should point at: cli-tests/registry-drift/tests/axe
  # can each report "skipped" on a PR that doesn't touch their paths, and a
  # required check stuck on "skipped" forever is indistinguishable from one
  # that's still queued in GitHub's UI — `ci-ok` always runs (`if: always()`)
  # and gives one green/red signal that treats a legitimate skip as fine but
  # still fails on a real failure or cancellation.
  #
  # `changes` is included here too, and treated as a required result (not a
  # legitimate-skip candidate): it has no `if:` gating it, so anything other
  # than `success` means the filter computation itself failed (bad checkout,
  # action download failure, malformed filter syntax) — every other job's
  # `if:` would then evaluate its `needs.changes.outputs.*` as empty/false
  # and report `skipped`, which this job's loop treats as fine. Without
  # `changes` in the loop, a broken `changes` job would produce an all-green
  # `ci-ok` on a pipeline that never actually ran anything — a false green.
  ci-ok:
    name: CI ok
    needs: [changes, cli-tests, registry-drift, tests, axe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required job results
        # Job results are passed through env, not interpolated with ${{ }}
        # directly into the shell script body, to avoid the injection-prone
        # pattern of substituting untrusted/expression values into a shell
        # string before the shell ever sees them. `needs.*.result` values
        # are controlled by GitHub Actions itself (one of a fixed enum:
        # success/failure/cancelled/skipped), not attacker-controlled, but
        # this keeps the pattern consistent and avoids the anti-pattern.
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLI_TESTS_RESULT: ${{ needs.cli-tests.result }}
          REGISTRY_DRIFT_RESULT: ${{ needs.registry-drift.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          AXE_RESULT: ${{ needs.axe.result }}
        run: |
          for r in "$CHANGES_RESULT" "$CLI_TESTS_RESULT" "$REGISTRY_DRIFT_RESULT" "$TESTS_RESULT" "$AXE_RESULT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required job did not pass (result: $r)" >&2
              exit 1
            fi
          done
          echo "all required jobs passed or were legitimately skipped"
